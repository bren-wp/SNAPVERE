<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SNAPVERE</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="brand">
      <img src="icons/icon-48.png" width="48" height="48" alt="">
      <div class="brand-copy">
        <div class="wordmark">SNAPVERE</div>
      </div>
    </header>

    <h1 data-i18n="captureActions"></h1>

    <section class="actions" data-i18n-aria-label="captureActions">
      <button class="capture-action primary" type="button" data-action="CAPTURE_VISIBLE">
        <span class="action-icon" aria-hidden="true"><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/><rect x="8" y="12" width="8" height="5" rx="1"/></g></svg></span>
        <span class="action-copy">
          <strong data-i18n="captureVisible"></strong>
          <small data-i18n="captureVisibleHint"></small>
        </span>
      </button>

      <button class="capture-action" type="button" data-action="CAPTURE_REGION">
        <span class="action-icon region-icon" aria-hidden="true"><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5a1 1 0 0 0-1 1v4m11-5h4a1 1 0 0 1 1 1v4m0 6v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/><rect x="8" y="8" width="8" height="8" rx="1" stroke-dasharray="2 2"/></g></svg></span>
        <span class="action-copy">
          <strong data-i18n="captureRegion"></strong>
          <small data-i18n="captureRegionHint"></small>
        </span>
      </button>

      <button class="capture-action" type="button" data-action="CAPTURE_FULL">
        <span class="action-icon" aria-hidden="true"><svg class="action-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 8h7m-7 4h7m-7 4h4"/></g></svg></span>
        <span class="action-copy">
          <strong data-i18n="captureFull"></strong>
          <small data-i18n="captureFullHint"></small>
        </span>
      </button>
    </section>

    <div class="divider"></div>

    <footer class="footer">
      <button id="recent" class="footer-action" type="button">
        <svg class="footer-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/><path d="M12 7v5l3 2"/></g></svg>
        <span data-i18n="recentCaptures"></span>
      </button>
      <button id="settings" class="icon-button footer-settings" type="button" data-i18n-aria-label="settings" aria-label="Settings"><svg class="footer-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.1v2.1m0 13.6v2.1M3.1 12h2.1m13.6 0h2.1M5.7 5.7l1.5 1.5m9.6 9.6 1.5 1.5m0-12.6-1.5 1.5M7.2 16.8l-1.5 1.5"/><circle cx="12" cy="12" r="3.4"/></g></svg></button>
    </footer>
    <span id="status" class="status" role="status" aria-live="polite"></span>

    <p class="limit-note" data-i18n="fullPageLimitNote"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
