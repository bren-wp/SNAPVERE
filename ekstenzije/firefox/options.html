<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SNAPVERE</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="panel">
    <header class="brand">
      <img src="icons/icon-48.png" width="48" height="48" alt="">
      <div>
        <div class="wordmark">SNAPVERE</div>
        <h1 data-i18n="optionsTitle"></h1>
      </div>
    </header>

    <nav class="tabs" role="tablist" data-i18n-aria-label="optionsNavigation">
      <button id="settings-tab" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="settings-panel" data-panel="settings-panel" data-i18n="settings"></button>
      <button id="recent-tab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="recent-panel" data-panel="recent-panel" data-i18n="recentCaptures"></button>
    </nav>

    <section id="settings-panel" class="surface" role="tabpanel" aria-labelledby="settings-tab">
      <form id="settings-form" novalidate>
        <p class="privacy" data-i18n="fileNamingNote"></p>

        <label class="check">
          <input id="save-as" name="saveAs" type="checkbox">
          <span data-i18n="askWhereToSave"></span>
        </label>

        <p class="privacy" data-i18n="privacyNote"></p>

        <div class="actions">
          <button class="primary" type="submit" data-i18n="saveSettings"></button>
          <span id="settings-status" class="status" role="status" aria-live="polite"></span>
        </div>
      </form>
    </section>

    <section id="recent-panel" class="surface" role="tabpanel" aria-labelledby="recent-tab" hidden>
      <div class="section-heading">
        <div>
          <h2 data-i18n="recentCaptures"></h2>
          <p data-i18n="recentDescription"></p>
        </div>
        <div class="section-actions">
          <button id="open-downloads-folder" class="secondary" type="button" data-i18n="openDownloadsFolder"></button>
          <button id="refresh-recent" class="secondary" type="button" data-i18n="refresh"></button>
        </div>
      </div>
      <div id="recent-list" class="recent-list" aria-live="polite"></div>
      <div id="recent-status" class="status" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
