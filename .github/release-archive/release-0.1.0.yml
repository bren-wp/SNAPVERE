name: Release 0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/release-triggers/v0.1.0'

permissions:
  contents: write

concurrency:
  group: snapvere-release-0.1.0
  cancel-in-progress: false

env:
  SNAPVERE_VERSION: 0.1.0

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SNAPVERE_ANDROID_KEYSTORE_BASE64: ${{ secrets.SNAPVERE_ANDROID_KEYSTORE_BASE64 }}
      SNAPVERE_ANDROID_KEY_ALIAS: ${{ secrets.SNAPVERE_ANDROID_KEY_ALIAS }}
      SNAPVERE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SNAPVERE_ANDROID_KEYSTORE_PASSWORD }}
      SNAPVERE_ANDROID_KEY_PASSWORD: ${{ secrets.SNAPVERE_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Android release source contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          grep -q "versionCode 10" android/app/build.gradle
          grep -q "versionName '$SNAPVERE_VERSION'" android/app/build.gradle
          if grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            echo 'INTERNET permission is forbidden for the local-first Android release.' >&2
            exit 1
          fi
          grep -q 'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION' android/app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="mediaProjection"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -A4 'android:name=".CaptureService"' android/app/src/main/AndroidManifest.xml | grep -q 'android:exported="false"'

      - name: Require stable Android release signing identity
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            SNAPVERE_ANDROID_KEYSTORE_BASE64 \
            SNAPVERE_ANDROID_KEY_ALIAS \
            SNAPVERE_ANDROID_KEYSTORE_PASSWORD \
            SNAPVERE_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required Android release signing secret is missing: $name" >&2
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/snapvere-release.jks"
          printf '%s' "$SNAPVERE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          keytool -list \
            -keystore "$keystore" \
            -storepass "$SNAPVERE_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$SNAPVERE_ANDROID_KEY_ALIAS" >/dev/null

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'

      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Lint, test and build Android release source
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android --no-daemon clean lintDebug lintRelease testDebugUnitTest assembleDebug assembleRelease
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Align, sign and verify SNAPVERE.apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-android
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          unsigned='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          aligned="$RUNNER_TEMP/snapvere-release-aligned.apk"
          keystore="$RUNNER_TEMP/snapvere-release.jks"

          "$build_tools/zipalign" -P 16 -f -v 4 "$unsigned" "$aligned"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$SNAPVERE_ANDROID_KEY_ALIAS" \
            --ks-pass env:SNAPVERE_ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:SNAPVERE_ANDROID_KEY_PASSWORD \
            --out release-android/SNAPVERE.apk \
            "$aligned"

          test -s release-android/SNAPVERE.apk
          "$build_tools/apksigner" verify --verbose --print-certs release-android/SNAPVERE.apk
          "$build_tools/zipalign" -c -P 16 -v 4 release-android/SNAPVERE.apk

      - name: Build and validate Android source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive \
            --format=zip \
            --prefix="SNAPVERE-Android-${SNAPVERE_VERSION}/" \
            --output=release-android/SNAPVERE-Android-Source.zip \
            HEAD:android

          test -s release-android/SNAPVERE-Android-Source.zip
          unzip -t release-android/SNAPVERE-Android-Source.zip >/dev/null
          listing="$(unzip -Z1 release-android/SNAPVERE-Android-Source.zip)"
          grep -Fq "SNAPVERE-Android-${SNAPVERE_VERSION}/app/build.gradle" <<< "$listing"
          grep -Fq "SNAPVERE-Android-${SNAPVERE_VERSION}/app/src/main/AndroidManifest.xml" <<< "$listing"
          grep -Fq "SNAPVERE-Android-${SNAPVERE_VERSION}/app/src/main/java/com/snapvere/android/MainActivity.java" <<< "$listing"
          if grep -Eq '/(build|\.gradle)/' <<< "$listing"; then
            echo 'Android source archive unexpectedly contains generated build/cache output.' >&2
            exit 1
          fi

      - name: Record Android transfer digests
        shell: bash
        run: |
          set -euo pipefail
          cd release-android
          apk_hash="$(sha256sum SNAPVERE.apk | awk '{print $1}')"
          source_hash="$(sha256sum SNAPVERE-Android-Source.zip | awk '{print $1}')"
          printf '{"SNAPVERE.apk":"%s","SNAPVERE-Android-Source.zip":"%s"}\n' \
            "$apk_hash" "$source_hash" > android-release-hashes.json
          echo "SHA256 SNAPVERE.apk = $apk_hash"
          echo "SHA256 SNAPVERE-Android-Source.zip = $source_hash"

      - name: Upload validated Android release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapvere-android-release-${{ github.sha }}
          path: |
            release-android/SNAPVERE.apk
            release-android/SNAPVERE-Android-Source.zip
            release-android/android-release-hashes.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove Android signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/snapvere-release.jks" "$RUNNER_TEMP/snapvere-release-aligned.apk"

  release:
    needs: android-release
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Validate release source contract
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "v0.1.0 release workflow must run from main. Actual ref: $env:GITHUB_REF"
          }
          if (-not (Test-Path -LiteralPath '.github/release-triggers/v0.1.0' -PathType Leaf)) {
            throw 'Missing dedicated v0.1.0 release trigger file.'
          }
          if (-not (Test-Path -LiteralPath 'RELEASE_NOTES_0.1.0.md' -PathType Leaf)) {
            throw 'Missing RELEASE_NOTES_0.1.0.md.'
          }

          $props = Get-Content -Raw -LiteralPath 'Directory.Build.props'
          foreach ($required in @(
            '<VersionPrefix>0.1.0</VersionPrefix>',
            '<AssemblyVersion>0.1.0.0</AssemblyVersion>',
            '<FileVersion>0.1.0.0</FileVersion>',
            '<NuGetAudit>true</NuGetAudit>',
            '<NuGetAuditMode>all</NuGetAuditMode>'
          )) {
            if (-not $props.Contains($required, [StringComparison]::Ordinal)) {
              throw "Directory.Build.props is missing release requirement: $required"
            }
          }

      - name: Restore, audit, build and test release source
        shell: pwsh
        run: |
          dotnet restore SNAPVERE.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet build SNAPVERE.sln --configuration Release --no-restore -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet test tests/Snapvere.UnitTests/Snapvere.UnitTests.csproj --configuration Release --no-restore -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($target in @(
            @{ Rid = 'win-x86'; Platform = 'x86' },
            @{ Rid = 'win-arm64'; Platform = 'ARM64' }
          )) {
            dotnet restore src/Snapvere.App/Snapvere.App.csproj --runtime $target.Rid
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet build src/Snapvere.App/Snapvere.App.csproj --configuration Release --runtime $target.Rid --no-restore "-p:Platform=$($target.Platform)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build native application payloads and integrity manifests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $platforms = @{ 'x86' = 'x86'; 'x64' = 'x64'; 'arm64' = 'ARM64' }
          foreach ($arch in @('x86', 'x64', 'arm64')) {
            $rid = "win-$arch"
            $output = "artifacts/app-$arch"
            dotnet publish src/Snapvere.App/Snapvere.App.csproj `
              --configuration Release `
              --runtime $rid `
              "-p:Platform=$($platforms[$arch])" `
              -p:SelfContained=true `
              -p:WindowsAppSDKSelfContained=true `
              -p:PublishReadyToRun=true `
              -p:DebugType=None `
              -p:DebugSymbols=false `
              "-p:Version=$env:SNAPVERE_VERSION" `
              --output $output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $outputRoot = (Resolve-Path $output).Path
            $manifestFiles = @(
              Get-ChildItem -LiteralPath $outputRoot -Recurse -File |
                ForEach-Object {
                  $relativePath = [System.IO.Path]::GetRelativePath($outputRoot, $_.FullName).Replace('\\', '/')
                  [pscustomobject]@{
                    Path = $relativePath
                    Length = $_.Length
                    Sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
                  }
                } |
                Sort-Object Path
            )
            $manifest = [pscustomobject]@{
              FormatVersion = 1
              Files = $manifestFiles
            }
            $manifestPath = "artifacts/SNAPVERE-payload-$arch.integrity.json"
            $manifest | ConvertTo-Json -Depth 4 -Compress | Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM
            Compress-Archive -Path "$output/*" -DestinationPath "artifacts/SNAPVERE-payload-$arch.zip" -CompressionLevel Optimal
          }

      - name: Validate all embedded architecture payloads and integrity manifests
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($arch in @('x86', 'x64', 'arm64')) {
            $zipPath = (Resolve-Path "artifacts/SNAPVERE-payload-$arch.zip").Path
            $integrityPath = (Resolve-Path "artifacts/SNAPVERE-payload-$arch.integrity.json").Path
            $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
            try {
              $app = @($archive.Entries | Where-Object { $_.FullName -ieq 'Snapvere.exe' })
              if ($app.Count -ne 1) { throw "$arch payload must contain exactly one root Snapvere.exe." }
              if ((Get-Item $zipPath).Length -lt 20MB) { throw "$arch payload is unexpectedly small." }
            }
            finally { $archive.Dispose() }

            $manifest = Get-Content -LiteralPath $integrityPath -Raw | ConvertFrom-Json
            if ($manifest.FormatVersion -ne 1 -or @($manifest.Files).Count -eq 0) {
              throw "$arch payload integrity manifest is invalid."
            }
            if (-not ($manifest.Files | Where-Object { $_.Path -ieq 'Snapvere.exe' -and $_.Sha256 -match '^[0-9A-F]{64}$' })) {
              throw "$arch payload integrity manifest does not contain a valid Snapvere.exe digest."
            }
          }

      - name: Capture release rendered UI
        shell: pwsh
        run: |
          & ./eng/Capture-SnapvereVisualQa.ps1 `
            -AppPath (Resolve-Path 'artifacts/app-x64/Snapvere.exe').Path `
            -OutputDirectory (Join-Path $PWD 'artifacts/visual-qa')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $manifest = Get-Content -Raw -LiteralPath 'artifacts/visual-qa/manifest.json' | ConvertFrom-Json
          if ($manifest.CaptureContractVersion -lt 2) { throw 'Rendered UI manifest does not use the hardened capture contract.' }
          if (@($manifest.Surfaces).Count -ne 6) { throw 'Release visual QA must contain exactly six surfaces.' }
          foreach ($surface in $manifest.Surfaces) {
            if ($surface.TargetOwned -ne $true) { throw "Visual surface $($surface.File) is not marked target-owned." }
          }

      - name: Build universal Setup and Portable
        shell: pwsh
        run: |
          $x86 = (Resolve-Path 'artifacts/SNAPVERE-payload-x86.zip').Path
          $x64 = (Resolve-Path 'artifacts/SNAPVERE-payload-x64.zip').Path
          $arm64 = (Resolve-Path 'artifacts/SNAPVERE-payload-arm64.zip').Path
          $x86Integrity = (Resolve-Path 'artifacts/SNAPVERE-payload-x86.integrity.json').Path
          $x64Integrity = (Resolve-Path 'artifacts/SNAPVERE-payload-x64.integrity.json').Path
          $arm64Integrity = (Resolve-Path 'artifacts/SNAPVERE-payload-arm64.integrity.json').Path

          dotnet publish src/Snapvere.Setup/Snapvere.Setup.csproj `
            --configuration Release `
            --runtime win-x86 `
            -p:Platform=x86 `
            -p:SelfContained=true `
            "-p:Version=$env:SNAPVERE_VERSION" `
            "-p:SnapverePayloadX86Path=$x86" `
            "-p:SnapverePayloadX64Path=$x64" `
            "-p:SnapverePayloadArm64Path=$arm64" `
            --output artifacts/setup-universal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet publish src/Snapvere.Portable/Snapvere.Portable.csproj `
            --configuration Release `
            --runtime win-x86 `
            -p:Platform=x86 `
            -p:SelfContained=true `
            "-p:Version=$env:SNAPVERE_VERSION" `
            "-p:SnapverePayloadX86Path=$x86" `
            "-p:SnapverePayloadX64Path=$x64" `
            "-p:SnapverePayloadArm64Path=$arm64" `
            "-p:SnapverePayloadX86IntegrityPath=$x86Integrity" `
            "-p:SnapverePayloadX64IntegrityPath=$x64Integrity" `
            "-p:SnapverePayloadArm64IntegrityPath=$arm64Integrity" `
            --output artifacts/portable-universal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item artifacts/setup-universal/SNAPVERE-Setup.exe release/SNAPVERE-Setup.exe
          Copy-Item artifacts/portable-universal/SNAPVERE-Portable.exe release/SNAPVERE-Portable.exe

      - name: Download validated Android release payload
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: snapvere-android-release-${{ github.sha }}
          path: artifacts/android-release

      - name: Verify Android transfer and assemble four release assets
        shell: pwsh
        run: |
          $androidRoot = (Resolve-Path 'artifacts/android-release').Path
          $transferHashes = Get-Content -Raw -LiteralPath (Join-Path $androidRoot 'android-release-hashes.json') | ConvertFrom-Json -AsHashtable
          foreach ($name in @('SNAPVERE.apk', 'SNAPVERE-Android-Source.zip')) {
            $path = Join-Path $androidRoot $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing validated Android asset $name." }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if (-not [string]::Equals($actual, $transferHashes[$name], [StringComparison]::OrdinalIgnoreCase)) {
              throw "Android artifact transfer digest mismatch for $name."
            }
            Copy-Item -LiteralPath $path -Destination (Join-Path 'release' $name)
          }

      - name: Enforce exact four-file release contract and create digest notes
        shell: pwsh
        run: |
          $expected = @(
            'SNAPVERE-Android-Source.zip',
            'SNAPVERE-Portable.exe',
            'SNAPVERE-Setup.exe',
            'SNAPVERE.apk'
          )
          $actual = @(Get-ChildItem release -File | Select-Object -ExpandProperty Name | Sort-Object)
          if ($actual.Count -ne 4 -or @(Compare-Object $expected $actual).Count -ne 0) {
            throw "Release must contain exactly four approved assets. Actual: $($actual -join ', ')"
          }

          $hashes = @{}
          foreach ($name in $expected) {
            $file = Get-Item (Join-Path release $name)
            if ($name -like '*.exe' -and $file.Length -lt 50MB) { throw "$name is unexpectedly small." }
            if ($name -eq 'SNAPVERE.apk' -and $file.Length -lt 50KB) { throw "$name is unexpectedly small." }
            if ($name -eq 'SNAPVERE-Android-Source.zip' -and $file.Length -lt 10KB) { throw "$name is unexpectedly small." }
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashes[$name] = $hash
            Write-Host "SHA256 $name = $hash"
          }

          Copy-Item 'RELEASE_NOTES_0.1.0.md' 'artifacts/release-notes-final.md'
          Add-Content -LiteralPath 'artifacts/release-notes-final.md' -Value "`n## SHA-256 digests`n"
          foreach ($name in $expected) {
            Add-Content -LiteralPath 'artifacts/release-notes-final.md' -Value "- ``$name``: ``$($hashes[$name])``"
          }
          $hashes | ConvertTo-Json | Set-Content -LiteralPath 'artifacts/release-hashes.json' -Encoding utf8

      - name: Validate universal x64 and x86 runtime contracts
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'release/SNAPVERE-Setup.exe').Path
          $portable = (Resolve-Path 'release/SNAPVERE-Portable.exe').Path
          try {
            foreach ($arch in @('x64', 'x86')) {
              $env:SNAPVERE_PAYLOAD_ARCH = $arch
              & ./eng/Test-SnapverePackageLifecycle.ps1 -SetupPath $setup -PortablePath $portable -Version $env:SNAPVERE_VERSION -Arch $arch
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & ./eng/Test-SnapvereTrayFirstLaunch.ps1 -SetupPath $setup -PortablePath $portable -Version $env:SNAPVERE_VERSION -Arch $arch
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          finally {
            Remove-Item Env:SNAPVERE_PAYLOAD_ARCH -ErrorAction SilentlyContinue
          }

      - name: Create or verify immutable v0.1.0 tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repository = '${{ github.repository }}'
          $tag = "v$env:SNAPVERE_VERSION"
          $encodedTag = [Uri]::EscapeDataString($tag)
          $lookupOutput = @(& gh api "repos/$repository/git/ref/tags/$encodedTag" 2>&1)
          $lookupExitCode = $LASTEXITCODE
          $existing = $null

          if ($lookupExitCode -eq 0) {
            $existingJson = ($lookupOutput | ForEach-Object { $_.ToString() }) -join "`n"
            if ([string]::IsNullOrWhiteSpace($existingJson)) { throw "GitHub returned an empty response while querying immutable tag $tag." }
            $existing = $existingJson | ConvertFrom-Json
          }
          else {
            $lookupText = ($lookupOutput | ForEach-Object { $_.ToString() }) -join "`n"
            if ($lookupText -notmatch 'HTTP 404') { throw "Could not query immutable tag $tag. gh exit code $lookupExitCode. $lookupText" }
            Write-Host "$tag does not exist yet; it will be created only after every Windows and Android release gate has passed."
          }

          if ($null -ne $existing) {
            $object = $existing.object
            if ($null -eq $object -or [string]::IsNullOrWhiteSpace($object.sha)) { throw "GitHub returned an invalid ref object for immutable tag $tag." }
            $targetSha = $object.sha
            if ($object.type -eq 'tag') {
              $tagObjectOutput = @(& gh api "repos/$repository/git/tags/$targetSha" 2>&1)
              if ($LASTEXITCODE -ne 0) {
                $tagObjectError = ($tagObjectOutput | ForEach-Object { $_.ToString() }) -join "`n"
                throw "Could not resolve annotated tag object $targetSha for $tag. $tagObjectError"
              }
              $tagObject = (($tagObjectOutput | ForEach-Object { $_.ToString() }) -join "`n") | ConvertFrom-Json
              $targetSha = $tagObject.object.sha
            }
            if ([string]::IsNullOrWhiteSpace($targetSha) -or $targetSha -ne $env:GITHUB_SHA) {
              throw "Immutable tag $tag already targets $targetSha instead of validated commit $env:GITHUB_SHA."
            }
          }
          else {
            $tagCreateOutput = @(& gh api --method POST "repos/$repository/git/tags" `
              -f tag="$tag" `
              -f message="SNAPVERE $tag" `
              -f object="$env:GITHUB_SHA" `
              -f type='commit' 2>&1)
            if ($LASTEXITCODE -ne 0) {
              $tagCreateError = ($tagCreateOutput | ForEach-Object { $_.ToString() }) -join "`n"
              throw "Could not create annotated tag object for $tag. $tagCreateError"
            }
            $tagObject = ((($tagCreateOutput | ForEach-Object { $_.ToString() }) -join "`n")) | ConvertFrom-Json
            if ([string]::IsNullOrWhiteSpace($tagObject.sha)) { throw "GitHub created no usable annotated tag object for $tag." }
            $refCreateOutput = @(& gh api --method POST "repos/$repository/git/refs" -f ref="refs/tags/$tag" -f sha="$($tagObject.sha)" 2>&1)
            if ($LASTEXITCODE -ne 0) {
              $refCreateError = ($refCreateOutput | ForEach-Object { $_.ToString() }) -join "`n"
              throw "Could not create immutable tag ref $tag. $refCreateError"
            }
          }

      - name: Publish GitHub Release if absent
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:SNAPVERE_VERSION"
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already exists; published assets will not be replaced."
          }
          else {
            & gh release create $tag `
              release/SNAPVERE-Setup.exe `
              release/SNAPVERE-Portable.exe `
              release/SNAPVERE.apk `
              release/SNAPVERE-Android-Source.zip `
              --title "SNAPVERE $tag" `
              --notes-file artifacts/release-notes-final.md `
              --latest `
              --verify-tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify published v0.1.0 release and asset digests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:SNAPVERE_VERSION"
          $release = (& gh release view $tag --json tagName,isDraft,isPrerelease,assets,targetCommitish) | ConvertFrom-Json
          if ($release.tagName -ne $tag) { throw 'Release tag mismatch.' }
          if ($release.isDraft) { throw "$tag is still a draft." }
          if ($release.isPrerelease) { throw "$tag is unexpectedly a prerelease." }

          $expected = @('SNAPVERE-Android-Source.zip', 'SNAPVERE-Portable.exe', 'SNAPVERE-Setup.exe', 'SNAPVERE.apk')
          $published = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          if ($published.Count -ne 4 -or @(Compare-Object $expected $published).Count -ne 0) {
            throw "Published $tag must contain exactly four approved assets. Actual: $($published -join ', ')"
          }

          $localHashes = Get-Content -Raw -LiteralPath 'artifacts/release-hashes.json' | ConvertFrom-Json -AsHashtable
          foreach ($asset in $release.assets) {
            $expectedDigest = "sha256:$($localHashes[$asset.name])"
            if ([string]::IsNullOrWhiteSpace($asset.digest)) { throw "Published asset $($asset.name) has no GitHub digest to verify." }
            if (-not [string]::Equals($asset.digest, $expectedDigest, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Published asset digest mismatch for $($asset.name). Expected $expectedDigest, actual $($asset.digest)."
            }
          }

          Write-Host "Verified $tag with exactly four Windows/Android public assets and matching SHA-256 digests."
