name: Release 0.0.8

on:
  push:
    branches: [main]
    paths:
      - '.github/release-triggers/v0.0.8'

permissions:
  contents: write

concurrency:
  group: snapvere-release-0.0.8
  cancel-in-progress: false

env:
  SNAPVERE_VERSION: 0.0.8

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate release source contract
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "v0.0.8 release workflow must run from main. Actual ref: $env:GITHUB_REF"
          }
          if (-not (Test-Path -LiteralPath '.github/release-triggers/v0.0.8' -PathType Leaf)) {
            throw 'Missing dedicated v0.0.8 release trigger file.'
          }
          $props = Get-Content -Raw -LiteralPath 'Directory.Build.props'
          if ($props -notmatch '<VersionPrefix>0\.0\.8</VersionPrefix>') {
            throw 'Directory.Build.props does not declare VersionPrefix 0.0.8.'
          }
          if ($props -notmatch '<AssemblyVersion>0\.0\.8\.0</AssemblyVersion>') {
            throw 'Directory.Build.props does not declare AssemblyVersion 0.0.8.0.'
          }
          if ($props -notmatch '<FileVersion>0\.0\.8\.0</FileVersion>') {
            throw 'Directory.Build.props does not declare FileVersion 0.0.8.0.'
          }

      - name: Restore build and test release source
        shell: pwsh
        run: |
          dotnet restore SNAPVERE.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet build SNAPVERE.sln --configuration Release --no-restore -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet test tests/Snapvere.UnitTests/Snapvere.UnitTests.csproj --configuration Release --no-restore -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($target in @(
            @{ Rid = 'win-x86'; Platform = 'x86' },
            @{ Rid = 'win-arm64'; Platform = 'ARM64' }
          )) {
            dotnet restore src/Snapvere.App/Snapvere.App.csproj --runtime $target.Rid
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet build src/Snapvere.App/Snapvere.App.csproj --configuration Release --runtime $target.Rid --no-restore "-p:Platform=$($target.Platform)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build native application payloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $platforms = @{ 'x86' = 'x86'; 'x64' = 'x64'; 'arm64' = 'ARM64' }
          foreach ($arch in @('x86', 'x64', 'arm64')) {
            $rid = "win-$arch"
            $output = "artifacts/app-$arch"
            dotnet publish src/Snapvere.App/Snapvere.App.csproj `
              --configuration Release `
              --runtime $rid `
              "-p:Platform=$($platforms[$arch])" `
              -p:SelfContained=true `
              -p:WindowsAppSDKSelfContained=true `
              -p:PublishReadyToRun=true `
              -p:DebugType=None `
              -p:DebugSymbols=false `
              "-p:Version=$env:SNAPVERE_VERSION" `
              --output $output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Compress-Archive -Path "$output/*" -DestinationPath "artifacts/SNAPVERE-payload-$arch.zip" -CompressionLevel Optimal
          }

      - name: Validate all embedded architecture payloads
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($arch in @('x86', 'x64', 'arm64')) {
            $zipPath = (Resolve-Path "artifacts/SNAPVERE-payload-$arch.zip").Path
            $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
            try {
              $app = @($archive.Entries | Where-Object { $_.FullName -ieq 'Snapvere.exe' })
              if ($app.Count -ne 1) { throw "$arch payload must contain exactly one root Snapvere.exe." }
              if ((Get-Item $zipPath).Length -lt 20MB) { throw "$arch payload is unexpectedly small." }
              Write-Host "$arch payload OK: $([Math]::Round((Get-Item $zipPath).Length / 1MB, 1)) MB"
            }
            finally { $archive.Dispose() }
          }

      - name: Build universal Setup and Portable
        shell: pwsh
        run: |
          $x86 = (Resolve-Path 'artifacts/SNAPVERE-payload-x86.zip').Path
          $x64 = (Resolve-Path 'artifacts/SNAPVERE-payload-x64.zip').Path
          $arm64 = (Resolve-Path 'artifacts/SNAPVERE-payload-arm64.zip').Path

          dotnet publish src/Snapvere.Setup/Snapvere.Setup.csproj `
            --configuration Release `
            --runtime win-x86 `
            -p:Platform=x86 `
            -p:SelfContained=true `
            "-p:Version=$env:SNAPVERE_VERSION" `
            "-p:SnapverePayloadX86Path=$x86" `
            "-p:SnapverePayloadX64Path=$x64" `
            "-p:SnapverePayloadArm64Path=$arm64" `
            --output artifacts/setup-universal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet publish src/Snapvere.Portable/Snapvere.Portable.csproj `
            --configuration Release `
            --runtime win-x86 `
            -p:Platform=x86 `
            -p:SelfContained=true `
            "-p:Version=$env:SNAPVERE_VERSION" `
            "-p:SnapverePayloadX86Path=$x86" `
            "-p:SnapverePayloadX64Path=$x64" `
            "-p:SnapverePayloadArm64Path=$arm64" `
            --output artifacts/portable-universal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item artifacts/setup-universal/SNAPVERE-Setup.exe release/SNAPVERE-Setup.exe
          Copy-Item artifacts/portable-universal/SNAPVERE-Portable.exe release/SNAPVERE-Portable.exe

      - name: Enforce exact two-file release contract
        shell: pwsh
        run: |
          $expected = @('SNAPVERE-Portable.exe', 'SNAPVERE-Setup.exe')
          $actual = @(Get-ChildItem release -File | Select-Object -ExpandProperty Name | Sort-Object)
          if ($actual.Count -ne 2 -or @(Compare-Object $expected $actual).Count -ne 0) {
            throw "Release must contain exactly SNAPVERE-Setup.exe and SNAPVERE-Portable.exe. Actual: $($actual -join ', ')"
          }
          foreach ($file in Get-ChildItem release -File) {
            if ($file.Length -lt 50MB) { throw "$($file.Name) is unexpectedly small." }
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "SHA256 $($file.Name) = $hash"
          }

      - name: Validate universal x64 and x86 runtime contracts
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'release/SNAPVERE-Setup.exe').Path
          $portable = (Resolve-Path 'release/SNAPVERE-Portable.exe').Path
          try {
            foreach ($arch in @('x64', 'x86')) {
              $env:SNAPVERE_PAYLOAD_ARCH = $arch
              & ./eng/Test-SnapverePackageLifecycle.ps1 -SetupPath $setup -PortablePath $portable -Version $env:SNAPVERE_VERSION -Arch $arch
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & ./eng/Test-SnapvereTrayFirstLaunch.ps1 -SetupPath $setup -PortablePath $portable -Version $env:SNAPVERE_VERSION -Arch $arch
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          finally {
            Remove-Item Env:SNAPVERE_PAYLOAD_ARCH -ErrorAction SilentlyContinue
          }

      - name: Create or verify immutable v0.0.8 tag
        shell: pwsh
        run: |
          $tag = "v$env:SNAPVERE_VERSION"
          git fetch --force --tags origin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git rev-parse --verify --quiet "refs/tags/$tag" *> $null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            $tagCommit = (git rev-list -n 1 $tag).Trim()
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Immutable tag $tag already exists at $tagCommit instead of $env:GITHUB_SHA."
            }
            Write-Host "Immutable tag $tag already points to this validated release commit."
          }
          else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "SNAPVERE $tag"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish GitHub Release if absent
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:SNAPVERE_VERSION"
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already exists; immutable published assets will not be replaced."
          }
          else {
            & gh release create $tag `
              release/SNAPVERE-Setup.exe `
              release/SNAPVERE-Portable.exe `
              --title "SNAPVERE $tag" `
              --notes-file RELEASE_NOTES_0.0.8.md `
              --latest `
              --verify-tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify published v0.0.8 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:SNAPVERE_VERSION"
          $release = (& gh release view $tag --json tagName,isDraft,isPrerelease,assets) | ConvertFrom-Json
          if ($release.tagName -ne $tag) { throw "Release tag mismatch." }
          if ($release.isDraft) { throw "$tag is still a draft." }
          if ($release.isPrerelease) { throw "$tag is unexpectedly a prerelease." }

          $expected = @('SNAPVERE-Portable.exe', 'SNAPVERE-Setup.exe')
          $published = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          if ($published.Count -ne 2 -or @(Compare-Object $expected $published).Count -ne 0) {
            throw "Published $tag must contain exactly two public executables. Actual: $($published -join ', ')"
          }
          Write-Host "Verified $tag with exactly two universal public executables."
