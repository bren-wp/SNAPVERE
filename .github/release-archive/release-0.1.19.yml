name: Release 0.1.19

on:
  push:
    branches: [main]
    paths:
      - '.github/release-triggers/v0.1.19'

permissions:
  contents: read

concurrency:
  group: snapvere-release-0.1.19
  cancel-in-progress: false

env:
  SNAPVERE_VERSION: 0.1.19

jobs:
  browser-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate browser source store and version contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          node ekstenzije/tools/validate-extensions.mjs
          node ekstenzije/tools/verify-extension-parity.mjs
          node ekstenzije/tools/smoke-test-background.mjs
          node ekstenzije/tools/test-hotkey-failure-feedback.mjs
          node ekstenzije/tools/test-options-runtime.mjs
          node ekstenzije/tools/test-capture-runtime.mjs
          python eng/validate-product-contract.py
          python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==11.3.0'
          python ekstenzije/tools/generate-store-assets.py
          node ekstenzije/tools/validate-store-readiness.mjs

      - name: Build reproducible browser packages twice
        shell: bash
        run: |
          set -euo pipefail
          bash ekstenzije/tools/package-extensions.sh release-browser-pass-1
          bash ekstenzije/tools/package-extensions.sh release-browser-pass-2
          for name in Chrome Edge Opera Firefox; do
            cmp "release-browser-pass-1/SNAPVERE-$name.zip" "release-browser-pass-2/SNAPVERE-$name.zip"
          done
          cmp release-browser-pass-1/SHA256SUMS.txt release-browser-pass-2/SHA256SUMS.txt
          (
            cd release-browser-pass-1
            sha256sum -c SHA256SUMS.txt
          )
          shopt -s nullglob
          packages=(release-browser-pass-1/SNAPVERE-*.zip)
          [[ "${#packages[@]}" -eq 4 ]]
          expected=$'SNAPVERE-Chrome.zip\nSNAPVERE-Edge.zip\nSNAPVERE-Firefox.zip\nSNAPVERE-Opera.zip'
          actual="$(printf '%s\n' "${packages[@]##*/}" | sort)"
          [[ "$actual" == "$expected" ]]
          mv release-browser-pass-1 release-browser
          rm -rf release-browser-pass-2

      - name: Upload validated browser payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapvere-browser-release-${{ github.sha }}
          path: |
            release-browser/SNAPVERE-Chrome.zip
            release-browser/SNAPVERE-Edge.zip
            release-browser/SNAPVERE-Opera.zip
            release-browser/SNAPVERE-Firefox.zip
            release-browser/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [browser-release]
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Validate 0.1.19 release source contract
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw "v0.1.19 release must run from main. Actual: $env:GITHUB_REF" }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checkout is not the exact release commit.' }
          if (-not (Test-Path -LiteralPath '.github/release-triggers/v0.1.19' -PathType Leaf)) { throw 'Missing v0.1.19 release trigger.' }
          if (Test-Path -LiteralPath 'RELEASE_NOTES_0.1.19.md') { throw 'Version-specific root release notes are forbidden; use RELEASES.md.' }
          python eng/validate-product-contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $props = Get-Content -Raw -LiteralPath 'Directory.Build.props'
          foreach ($required in @(
            '<VersionPrefix>0.1.19</VersionPrefix>',
            '<AssemblyVersion>0.1.19.0</AssemblyVersion>',
            '<FileVersion>0.1.19.0</FileVersion>',
            '<NuGetAudit>true</NuGetAudit>',
            '<NuGetAuditMode>all</NuGetAuditMode>'
          )) {
            if (-not $props.Contains($required, [StringComparison]::Ordinal)) { throw "Directory.Build.props missing: $required" }
          }

      - name: Restore audit build and test Windows source
        shell: pwsh
        run: |
          dotnet restore SNAPVERE.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build SNAPVERE.sln --configuration Release --no-restore -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Snapvere.UnitTests/Snapvere.UnitTests.csproj --configuration Release --no-restore -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($target in @(@{ Rid='win-x86'; Platform='x86' }, @{ Rid='win-arm64'; Platform='ARM64' })) {
            dotnet restore src/Snapvere.App/Snapvere.App.csproj --runtime $target.Rid
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet build src/Snapvere.App/Snapvere.App.csproj --configuration Release --runtime $target.Rid --no-restore "-p:Platform=$($target.Platform)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build architecture payloads and integrity manifests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $platforms = @{ x86='x86'; x64='x64'; arm64='ARM64' }
          foreach ($arch in @('x86','x64','arm64')) {
            $rid = "win-$arch"
            $output = "artifacts/app-$arch"
            dotnet publish src/Snapvere.App/Snapvere.App.csproj --configuration Release --runtime $rid "-p:Platform=$($platforms[$arch])" -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -p:PublishReadyToRun=true -p:DebugType=None -p:DebugSymbols=false "-p:Version=$env:SNAPVERE_VERSION" --output $output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $root = (Resolve-Path $output).Path
            $files = @(Get-ChildItem -LiteralPath $root -Recurse -File | ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath($root, $_.FullName).Replace('\\','/')
              [pscustomobject]@{ Path=$relative; Length=$_.Length; Sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToUpperInvariant() }
            } | Sort-Object Path)
            if ($files.Count -eq 0) { throw "$arch payload is empty." }
            [pscustomobject]@{ FormatVersion=1; Files=$files } | ConvertTo-Json -Depth 4 -Compress | Set-Content -LiteralPath "artifacts/SNAPVERE-payload-$arch.integrity.json" -Encoding utf8NoBOM
            Compress-Archive -Path "$output/*" -DestinationPath "artifacts/SNAPVERE-payload-$arch.zip" -CompressionLevel Optimal
          }

      - name: Validate architecture payloads
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($arch in @('x86','x64','arm64')) {
            $zip = (Resolve-Path "artifacts/SNAPVERE-payload-$arch.zip").Path
            if ((Get-Item $zip).Length -lt 20MB) { throw "$arch payload is unexpectedly small." }
            $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
            try {
              $apps = @($archive.Entries | Where-Object { $_.FullName -ieq 'Snapvere.exe' })
              if ($apps.Count -ne 1) { throw "$arch payload must contain one root Snapvere.exe." }
            } finally { $archive.Dispose() }
            $manifest = Get-Content -Raw -LiteralPath "artifacts/SNAPVERE-payload-$arch.integrity.json" | ConvertFrom-Json
            if ($manifest.FormatVersion -ne 1 -or @($manifest.Files).Count -eq 0) { throw "$arch integrity manifest is invalid." }
            if (-not ($manifest.Files | Where-Object { $_.Path -ieq 'Snapvere.exe' -and $_.Sha256 -match '^[0-9A-F]{64}$' })) { throw "$arch manifest lacks Snapvere.exe SHA-256." }
          }

      - name: Build universal Setup and Portable
        shell: pwsh
        run: |
          $x86 = (Resolve-Path 'artifacts/SNAPVERE-payload-x86.zip').Path
          $x64 = (Resolve-Path 'artifacts/SNAPVERE-payload-x64.zip').Path
          $arm64 = (Resolve-Path 'artifacts/SNAPVERE-payload-arm64.zip').Path
          $x86Integrity = (Resolve-Path 'artifacts/SNAPVERE-payload-x86.integrity.json').Path
          $x64Integrity = (Resolve-Path 'artifacts/SNAPVERE-payload-x64.integrity.json').Path
          $arm64Integrity = (Resolve-Path 'artifacts/SNAPVERE-payload-arm64.integrity.json').Path
          dotnet publish src/Snapvere.Setup/Snapvere.Setup.csproj --configuration Release --runtime win-x86 -p:Platform=x86 -p:SelfContained=true "-p:Version=$env:SNAPVERE_VERSION" "-p:SnapverePayloadX86Path=$x86" "-p:SnapverePayloadX64Path=$x64" "-p:SnapverePayloadArm64Path=$arm64" --output artifacts/setup-universal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/Snapvere.Portable/Snapvere.Portable.csproj --configuration Release --runtime win-x86 -p:Platform=x86 -p:SelfContained=true "-p:Version=$env:SNAPVERE_VERSION" "-p:SnapverePayloadX86Path=$x86" "-p:SnapverePayloadX64Path=$x64" "-p:SnapverePayloadArm64Path=$arm64" "-p:SnapverePayloadX86IntegrityPath=$x86Integrity" "-p:SnapverePayloadX64IntegrityPath=$x64Integrity" "-p:SnapverePayloadArm64IntegrityPath=$arm64Integrity" --output artifacts/portable-universal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path artifacts/universal | Out-Null
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item artifacts/setup-universal/SNAPVERE-Setup.exe artifacts/universal/SNAPVERE-Setup.exe
          Copy-Item artifacts/portable-universal/SNAPVERE-Portable.exe artifacts/universal/SNAPVERE-Portable.exe
          Copy-Item artifacts/universal/SNAPVERE-Setup.exe release/SNAPVERE-Setup.exe
          Copy-Item artifacts/universal/SNAPVERE-Portable.exe release/SNAPVERE-Portable.exe

      - name: Enforce Windows package size budgets
        shell: pwsh
        run: |
          & ./eng/Assert-SnapverePackageSize.ps1 -ArtifactsRoot (Join-Path $PWD 'artifacts')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate x64 and x86 Setup Portable lifecycle and tray-first behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'release/SNAPVERE-Setup.exe').Path
          $portable = (Resolve-Path 'release/SNAPVERE-Portable.exe').Path
          $markerDirectory = Join-Path $PWD 'artifacts/lifecycle-completion'
          New-Item -ItemType Directory -Force -Path $markerDirectory | Out-Null
          try {
            foreach ($arch in @('x64','x86')) {
              $env:SNAPVERE_PAYLOAD_ARCH = $arch
              & ./eng/Test-SnapverePackageLifecycle.ps1 -SetupPath $setup -PortablePath $portable -Version $env:SNAPVERE_VERSION -Arch $arch
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & ./eng/Test-SnapvereTrayFirstLaunch.ps1 -SetupPath $setup -PortablePath $portable -Version $env:SNAPVERE_VERSION -Arch $arch
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              Set-Content -LiteralPath (Join-Path $markerDirectory "$arch.ok") -Value "SNAPVERE $env:SNAPVERE_VERSION $arch LIFECYCLE_OK" -Encoding utf8NoBOM
            }
          } finally { Remove-Item Env:SNAPVERE_PAYLOAD_ARCH -ErrorAction SilentlyContinue }
          foreach ($arch in @('x64','x86')) {
            $marker = Join-Path $markerDirectory "$arch.ok"
            if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) { throw "Missing $arch lifecycle marker." }
            $expectedMarker = "SNAPVERE $env:SNAPVERE_VERSION $arch LIFECYCLE_OK"
            $actualMarker = (Get-Content -LiteralPath $marker -Raw).Trim()
            if ($actualMarker -ne $expectedMarker) { throw "$arch lifecycle marker is invalid: $actualMarker" }
          }

      - name: Download validated browser payload
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: snapvere-browser-release-${{ github.sha }}
          path: artifacts/browser-release

      - name: Verify transferred browser assets and assemble exact six-file release
        shell: pwsh
        run: |
          $browserRoot = (Resolve-Path 'artifacts/browser-release').Path
          $checksumPath = Join-Path $browserRoot 'SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) { throw 'Missing browser SHA256SUMS.txt.' }
          $browserHashes = @{}
          foreach ($line in Get-Content -LiteralPath $checksumPath) {
            if ($line -match '^([0-9a-fA-F]{64})\s+\*?(SNAPVERE-(Chrome|Edge|Opera|Firefox)\.zip)$') {
              $browserHashes[$matches[2]] = $matches[1].ToLowerInvariant()
            }
          }
          $browserNames = @('SNAPVERE-Chrome.zip','SNAPVERE-Edge.zip','SNAPVERE-Opera.zip','SNAPVERE-Firefox.zip')
          if ($browserHashes.Count -ne 4) { throw 'Browser checksum manifest must contain exactly four release ZIP digests.' }
          foreach ($name in $browserNames) {
            $path = Join-Path $browserRoot $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing browser asset $name." }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if (-not [string]::Equals($actual, $browserHashes[$name], [StringComparison]::OrdinalIgnoreCase)) { throw "Browser transfer digest mismatch for $name." }
            Copy-Item -LiteralPath $path -Destination (Join-Path release $name)
          }
          $expected = @('SNAPVERE-Chrome.zip','SNAPVERE-Edge.zip','SNAPVERE-Firefox.zip','SNAPVERE-Opera.zip','SNAPVERE-Portable.exe','SNAPVERE-Setup.exe') | Sort-Object
          $actualNames = @(Get-ChildItem release -File | Select-Object -ExpandProperty Name | Sort-Object)
          if ($actualNames.Count -ne 6 -or @(Compare-Object $expected $actualNames).Count -ne 0) { throw "Release must contain exactly six approved assets. Actual: $($actualNames -join ', ')" }
          foreach ($name in @('SNAPVERE-Setup.exe','SNAPVERE-Portable.exe')) {
            if ((Get-Item (Join-Path release $name)).Length -lt 50MB) { throw "$name is unexpectedly small." }
          }
          foreach ($name in $browserNames) {
            if ((Get-Item (Join-Path release $name)).Length -lt 10KB) { throw "$name is unexpectedly small." }
          }

      - name: Extract canonical v0.1.19 release notes and append SHA-256 digests
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          version = "0.1.19"
          lines = Path("RELEASES.md").read_text(encoding="utf-8").splitlines()
          starts = [i for i, line in enumerate(lines) if line.startswith(f"## v{version} — ")]
          if len(starts) != 1:
              raise SystemExit(f"expected exactly one v{version} section, found {len(starts)}")
          start = starts[0]
          end = next((i for i in range(start + 1, len(lines)) if lines[i].strip() == "---"), None)
          if end is None:
              raise SystemExit("release section terminator not found")
          section = "\n".join(lines[start:end]).strip() + "\n"
          if f"## v{version}" not in section or "## v0.1.13 — " in section:
              raise SystemExit("release note extraction boundary is invalid")
          Path("artifacts/release-notes-final.md").write_text(section, encoding="utf-8", newline="\n")
          '@ | Set-Content -LiteralPath artifacts/extract-release-notes.py -Encoding utf8NoBOM
          python artifacts/extract-release-notes.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = @('SNAPVERE-Chrome.zip','SNAPVERE-Edge.zip','SNAPVERE-Firefox.zip','SNAPVERE-Opera.zip','SNAPVERE-Portable.exe','SNAPVERE-Setup.exe') | Sort-Object
          $hashes = @{}
          foreach ($name in $expected) { $hashes[$name] = (Get-FileHash (Join-Path release $name) -Algorithm SHA256).Hash.ToLowerInvariant() }
          Add-Content -LiteralPath artifacts/release-notes-final.md -Value "`n## SHA-256 digests`n"
          foreach ($name in $expected) { Add-Content -LiteralPath artifacts/release-notes-final.md -Value "- ``$name``: ``$($hashes[$name])``" }
          $hashes | ConvertTo-Json | Set-Content -LiteralPath artifacts/release-hashes.json -Encoding utf8NoBOM

      - name: Refuse mutation when v0.1.19 GitHub Release already exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repository = '${{ github.repository }}'
          $tag = "v$env:SNAPVERE_VERSION"
          $result = @(& gh api "repos/$repository/releases/tags/$tag" 2>&1)
          $exit = $LASTEXITCODE
          if ($exit -eq 0) { throw "$tag GitHub Release already exists; refusing asset replacement or release mutation." }
          $text = ($result | ForEach-Object { $_.ToString() }) -join "`n"
          if ($text -notmatch 'HTTP 404') { throw "Could not safely determine existing release state. $text" }
          exit 0

      - name: Create or verify immutable v0.1.19 tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repository = '${{ github.repository }}'
          $tag = "v$env:SNAPVERE_VERSION"
          $encoded = [Uri]::EscapeDataString($tag)
          $lookup = @(& gh api "repos/$repository/git/ref/tags/$encoded" 2>&1)
          $exit = $LASTEXITCODE
          if ($exit -eq 0) {
            $ref = (($lookup | ForEach-Object { $_.ToString() }) -join "`n") | ConvertFrom-Json
            $target = $ref.object.sha
            if ($ref.object.type -eq 'tag') {
              $obj = (& gh api "repos/$repository/git/tags/$target") | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $target = $obj.object.sha
            }
            if ($target -ne $env:GITHUB_SHA) { throw "Immutable $tag already targets $target, not $env:GITHUB_SHA." }
          } else {
            $text = ($lookup | ForEach-Object { $_.ToString() }) -join "`n"
            if ($text -notmatch 'HTTP 404') { throw "Could not query $tag. $text" }
            & gh api --method POST "repos/$repository/git/refs" -f ref="refs/tags/$tag" -f sha="$env:GITHUB_SHA" | Out-Null
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:SNAPVERE_VERSION"
          & gh release create $tag `
            release/SNAPVERE-Setup.exe `
            release/SNAPVERE-Portable.exe `
            release/SNAPVERE-Chrome.zip `
            release/SNAPVERE-Edge.zip `
            release/SNAPVERE-Opera.zip `
            release/SNAPVERE-Firefox.zip `
            --title "SNAPVERE $tag" `
            --notes-file artifacts/release-notes-final.md `
            --latest `
            --verify-tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify published v0.1.19 release and asset digests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:SNAPVERE_VERSION"
          $release = (& gh release view $tag --json tagName,isDraft,isPrerelease,assets,targetCommitish) | ConvertFrom-Json
          if ($release.tagName -ne $tag -or $release.isDraft -or $release.isPrerelease) { throw 'Published release metadata is invalid.' }
          $expected = @('SNAPVERE-Chrome.zip','SNAPVERE-Edge.zip','SNAPVERE-Firefox.zip','SNAPVERE-Opera.zip','SNAPVERE-Portable.exe','SNAPVERE-Setup.exe') | Sort-Object
          $published = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          if ($published.Count -ne 6 -or @(Compare-Object $expected $published).Count -ne 0) { throw "Published $tag has invalid assets: $($published -join ', ')" }
          $local = Get-Content -Raw -LiteralPath artifacts/release-hashes.json | ConvertFrom-Json -AsHashtable
          foreach ($asset in $release.assets) {
            if (-not $local.ContainsKey($asset.name)) { throw "Unexpected published asset $($asset.name)." }
            $expectedDigest = "sha256:$($local[$asset.name])"
            if ([string]::IsNullOrWhiteSpace($asset.digest)) { throw "Published asset $($asset.name) has no GitHub digest." }
            if (-not [string]::Equals($asset.digest, $expectedDigest, [StringComparison]::OrdinalIgnoreCase)) { throw "Digest mismatch for $($asset.name)." }
          }
          Write-Host "Verified $tag with exactly six public assets and matching SHA-256 digests."
