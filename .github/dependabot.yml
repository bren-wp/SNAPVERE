version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:20"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    # CodeQL init and analyze must always resolve to the same pinned commit.
    # Separate Dependabot PRs break all four CodeQL language jobs.
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
