name: Correct Snapvere v0.2.4 prerelease source tag
on:
  push:
    branches:
      - feature/snapvere-full-rebrand
    paths:
      - .github/workflows/align-release-source.yml
permissions:
  contents: write
jobs:
  align-source:
    runs-on: ubuntu-latest
    steps:
      - name: Verify assets and correct prerelease source commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          release=$(gh api "repos/$repo/releases/tags/v0.2.4")
          echo "$release" | jq -e '.prerelease == true'
          for name in Snapvere-Portable.exe Snapvere-Setup.exe Snapvere-Setup.msi SHA256SUMS.txt; do
            echo "$release" | jq -e --arg n "$name" '.assets | any(.name == $n and .size > 0)'
          done
          if echo "$release" | jq -e '[.assets[].download_count] | any(. > 0)' >/dev/null; then
            echo "::error::Refusing to move published tag after downloads."
            exit 1
          fi
          main_sha=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
          old_sha=$(gh api "repos/$repo/git/ref/tags/v0.2.4" --jq '.object.sha')
          echo "Aligning release tag from $old_sha to main $main_sha"
          gh api --method PATCH "repos/$repo/git/refs/tags/v0.2.4" -f sha="$main_sha" -F force=true >/dev/null
          release_id=$(echo "$release" | jq -r '.id')
          gh api --method PATCH "repos/$repo/releases/$release_id" -f target_commitish="$main_sha" >/dev/null
          new_sha=$(gh api "repos/$repo/git/ref/tags/v0.2.4" --jq '.object.sha')
          test "$new_sha" = "$main_sha"
          echo "Snapvere v0.2.4 source tag now at $new_sha"
