name: Mirror verified Windows assets to Snapvere website
on:
  push:
    branches: [feature/snapvere-hardening-v0.2.5]
    paths: ['.github/workflows/mirror-site-files.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Download and verify published Snapvere packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/files
          gh release download v0.2.4 --repo bren-wp/Snapvere --dir site/files --clobber
          cd site/files
          for file in Snapvere-Portable.exe Snapvere-Setup.exe Snapvere-Setup.msi SHA256SUMS.txt; do
            test -s "$file" || { echo "Missing expected file: $file"; exit 1; }
          done
          sha256sum --check SHA256SUMS.txt
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          test "$(stat -c%s Snapvere-Portable.exe)" -gt 1000000
          test "$(stat -c%s Snapvere-Setup.exe)" -gt 1000000
          test "$(stat -c%s Snapvere-Setup.msi)" -gt 1000000
      - name: Commit verified first-party download assets to the open PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/files/Snapvere-Portable.exe site/files/Snapvere-Setup.exe site/files/Snapvere-Setup.msi site/files/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "assets: mirror verified Windows installers into site/files"
            git pull --rebase origin feature/snapvere-hardening-v0.2.5
            git push origin HEAD:feature/snapvere-hardening-v0.2.5
          fi
