name: Import real README screenshots

on:
  push:
    branches:
      - docs/readme-real-ui-screenshots

permissions:
  contents: write

jobs:
  import-screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download validated visual QA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10416919418/zip" > visual-qa.zip
          mkdir -p visual-qa
          unzip -q visual-qa.zip -d visual-qa
          test -s visual-qa/options.png
          test -s visual-qa/tray-menu.png
          test -s visual-qa/window-capture.png

      - name: Publish selected real UI screenshots
        run: |
          set -euo pipefail
          mkdir -p assets/branding/readme/screenshots
          cp visual-qa/options.png assets/branding/readme/screenshots/options.png
          cp visual-qa/tray-menu.png assets/branding/readme/screenshots/tray-menu.png
          cp visual-qa/window-capture.png assets/branding/readme/screenshots/window-capture.png
          rm -rf visual-qa visual-qa.zip

      - name: Commit screenshots and remove helper workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-readme-screenshots.yml
          git config user.name "Brendigo"
          git config user.email "info@brendigo.com"
          git add assets/branding/readme/screenshots .github/workflows/import-readme-screenshots.yml
          git diff --cached --check
          git commit -m "Add real SNAPVERE UI screenshots"
          git push origin HEAD:docs/readme-real-ui-screenshots
