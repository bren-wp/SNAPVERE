name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SNAPVERE_VERSION: 0.0.2

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore SNAPVERE.sln

      - name: Build x64
        run: dotnet build SNAPVERE.sln --configuration Release --no-restore -p:Platform=x64

      - name: Test
        run: dotnet test tests/Snapvere.UnitTests/Snapvere.UnitTests.csproj --configuration Release --no-restore -p:Platform=x64 --logger "trx;LogFileName=snapvere-tests.trx"

  build-x86:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore x86 app
        run: dotnet restore src/Snapvere.App/Snapvere.App.csproj --runtime win-x86

      - name: Build x86 app
        run: dotnet build src/Snapvere.App/Snapvere.App.csproj --configuration Release --runtime win-x86 --no-restore -p:Platform=x86

  package-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish self-contained SNAPVERE payload
        shell: pwsh
        run: |
          $rid = "win-${{ matrix.arch }}"
          dotnet publish src/Snapvere.App/Snapvere.App.csproj `
            --configuration Release `
            --runtime $rid `
            -p:Platform=${{ matrix.arch }} `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishReadyToRun=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$env:SNAPVERE_VERSION `
            --output "artifacts/app-${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build embedded payload
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "artifacts/app-${{ matrix.arch }}/*" `
            -DestinationPath "artifacts/SNAPVERE-payload-${{ matrix.arch }}.zip" `
            -CompressionLevel Optimal

      - name: Publish Setup EXE
        shell: pwsh
        run: |
          $payload = Join-Path $PWD "artifacts/SNAPVERE-payload-${{ matrix.arch }}.zip"
          dotnet publish src/Snapvere.Setup/Snapvere.Setup.csproj `
            --configuration Release `
            --runtime "win-${{ matrix.arch }}" `
            -p:Platform=${{ matrix.arch }} `
            -p:SnapverePayloadPath="$payload" `
            -p:Version=$env:SNAPVERE_VERSION `
            --output "artifacts/setup-${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Portable EXE
        shell: pwsh
        run: |
          $payload = Join-Path $PWD "artifacts/SNAPVERE-payload-${{ matrix.arch }}.zip"
          dotnet publish src/Snapvere.Portable/Snapvere.Portable.csproj `
            --configuration Release `
            --runtime "win-${{ matrix.arch }}" `
            -p:Platform=${{ matrix.arch }} `
            -p:SnapverePayloadPath="$payload" `
            -p:Version=$env:SNAPVERE_VERSION `
            --output "artifacts/portable-${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate package outputs
        shell: pwsh
        run: |
          $setup = "artifacts/setup-${{ matrix.arch }}/SNAPVERE-Setup.exe"
          $portable = "artifacts/portable-${{ matrix.arch }}/SNAPVERE-Portable.exe"
          if (-not (Test-Path $setup)) { throw "Setup executable was not produced: $setup" }
          if (-not (Test-Path $portable)) { throw "Portable executable was not produced: $portable" }
          if ((Get-Item $setup).Length -lt 1MB) { throw "Setup executable is unexpectedly small." }
          if ((Get-Item $portable).Length -lt 1MB) { throw "Portable executable is unexpectedly small." }

      - name: Smoke test Setup, installed startup, uninstall and Portable startup
        shell: pwsh
        run: |
          $setup = (Resolve-Path "artifacts/setup-${{ matrix.arch }}/SNAPVERE-Setup.exe").Path
          $portable = (Resolve-Path "artifacts/portable-${{ matrix.arch }}/SNAPVERE-Portable.exe").Path
          $install = Join-Path $env:LOCALAPPDATA "Programs/SNAPVERE"

          $licenseProbe = Start-Process -FilePath $setup -ArgumentList @("--silent") -Wait -PassThru
          if ($licenseProbe.ExitCode -ne 2) {
            throw "Silent setup without --accept-license must exit with code 2; got $($licenseProbe.ExitCode)."
          }

          $installProcess = Start-Process -FilePath $setup -ArgumentList @("--silent", "--accept-license") -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Silent install failed with exit code $($installProcess.ExitCode)." }
          $installedApp = Join-Path $install "Snapvere.exe"
          if (-not (Test-Path $installedApp)) { throw "Installed Snapvere.exe is missing." }
          if (-not (Test-Path (Join-Path $install "SNAPVERE-Setup.exe"))) { throw "Installed setup maintenance executable is missing." }
          if (Get-ChildItem $install -Filter "uninstall*.exe" -ErrorAction SilentlyContinue) {
            throw "A separate uninstall.exe-style executable must not be installed."
          }

          $appProbe = Start-Process -FilePath $installedApp -ArgumentList @("--startup-probe") -Wait -PassThru
          if ($appProbe.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA "SNAPVERE/Logs/startup.log"
            if (Test-Path $log) { Get-Content $log | Write-Host }
            throw "Installed SNAPVERE startup probe failed with exit code $($appProbe.ExitCode)."
          }

          $installedSetup = Join-Path $install "SNAPVERE-Setup.exe"
          $uninstallProcess = Start-Process -FilePath $installedSetup -ArgumentList @("--uninstall", "--silent") -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstallProcess.ExitCode)." }

          $deadline = (Get-Date).AddSeconds(15)
          while ((Test-Path $installedApp) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $installedApp) { throw "Snapvere.exe remains after uninstall cleanup timeout." }

          $portableProbe = Start-Process -FilePath $portable -ArgumentList @("--startup-probe") -Wait -PassThru
          if ($portableProbe.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA "SNAPVERE/Logs/startup.log"
            if (Test-Path $log) { Get-Content $log | Write-Host }
            throw "Portable SNAPVERE startup probe failed with exit code $($portableProbe.ExitCode)."
          }
