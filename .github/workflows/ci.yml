name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: snapvere-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SNAPVERE_VERSION: 0.0.3

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore SNAPVERE.sln

      - name: Build x64
        run: dotnet build SNAPVERE.sln --configuration Release --no-restore -p:Platform=x64

      - name: Test
        run: dotnet test tests/Snapvere.UnitTests/Snapvere.UnitTests.csproj --configuration Release --no-restore -p:Platform=x64 --logger "trx;LogFileName=snapvere-tests.trx"

  build-x86:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore x86 app
        run: dotnet restore src/Snapvere.App/Snapvere.App.csproj --runtime win-x86

      - name: Build x86 app
        run: dotnet build src/Snapvere.App/Snapvere.App.csproj --configuration Release --runtime win-x86 --no-restore -p:Platform=x86

  package-smoke:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish self-contained SNAPVERE payload
        shell: pwsh
        run: |
          $rid = "win-${{ matrix.arch }}"
          dotnet publish src/Snapvere.App/Snapvere.App.csproj `
            --configuration Release `
            --runtime $rid `
            -p:Platform=${{ matrix.arch }} `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishReadyToRun=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$env:SNAPVERE_VERSION `
            --output "artifacts/app-${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build embedded payload
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "artifacts/app-${{ matrix.arch }}/*" `
            -DestinationPath "artifacts/SNAPVERE-payload-${{ matrix.arch }}.zip" `
            -CompressionLevel Optimal

      - name: Publish Setup EXE
        shell: pwsh
        run: |
          $payload = Join-Path $PWD "artifacts/SNAPVERE-payload-${{ matrix.arch }}.zip"
          dotnet publish src/Snapvere.Setup/Snapvere.Setup.csproj `
            --configuration Release `
            --runtime "win-${{ matrix.arch }}" `
            -p:Platform=${{ matrix.arch }} `
            -p:SnapverePayloadPath="$payload" `
            -p:Version=$env:SNAPVERE_VERSION `
            --output "artifacts/setup-${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Portable EXE
        shell: pwsh
        run: |
          $payload = Join-Path $PWD "artifacts/SNAPVERE-payload-${{ matrix.arch }}.zip"
          dotnet publish src/Snapvere.Portable/Snapvere.Portable.csproj `
            --configuration Release `
            --runtime "win-${{ matrix.arch }}" `
            -p:Platform=${{ matrix.arch }} `
            -p:SnapverePayloadPath="$payload" `
            -p:Version=$env:SNAPVERE_VERSION `
            --output "artifacts/portable-${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate package outputs
        shell: pwsh
        run: |
          $setup = "artifacts/setup-${{ matrix.arch }}/SNAPVERE-Setup.exe"
          $portable = "artifacts/portable-${{ matrix.arch }}/SNAPVERE-Portable.exe"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw "Setup executable was not produced: $setup" }
          if (-not (Test-Path -LiteralPath $portable -PathType Leaf)) { throw "Portable executable was not produced: $portable" }
          if ((Get-Item -LiteralPath $setup).Length -lt 1MB) { throw "Setup executable is unexpectedly small." }
          if ((Get-Item -LiteralPath $portable).Length -lt 1MB) { throw "Portable executable is unexpectedly small." }

      - name: Smoke test package lifecycle and uninstall contract
        shell: pwsh
        run: |
          & ./eng/Test-SnapverePackageLifecycle.ps1 `
            -SetupPath "artifacts/setup-${{ matrix.arch }}/SNAPVERE-Setup.exe" `
            -PortablePath "artifacts/portable-${{ matrix.arch }}/SNAPVERE-Portable.exe" `
            -Version $env:SNAPVERE_VERSION `
            -Arch "${{ matrix.arch }}"
