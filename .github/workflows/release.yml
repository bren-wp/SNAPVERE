name: Snapvere Windows release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'apps/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-release:
    permissions:
      contents: write
    name: Build and publish Windows Portable / NSIS / MSI
    runs-on: windows-latest
    timeout-minutes: 85
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v7
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Determine and verify Snapvere version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content 'apps/desktop/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $pkg = Get-Content 'apps/desktop/package.json' -Raw | ConvertFrom-Json
          if ($config.productName -ne 'Snapvere') { throw 'Incorrect application name' }
          if ($config.identifier -ne 'com.brendigo.snapvere') { throw 'Incorrect application identifier' }
          if ($pkg.version -ne $config.version) { throw 'Package versions are not synchronized' }
          if ([string]::IsNullOrWhiteSpace($config.version)) { throw 'Empty release version' }
          $cargo = Get-Content 'apps/desktop/src-tauri/Cargo.toml' -Raw
          $cargoLock = Get-Content 'apps/desktop/src-tauri/Cargo.lock' -Raw
          $npmLock = Get-Content 'apps/desktop/package-lock.json' -Raw | ConvertFrom-Json -AsHashtable
          # Rust files may have CRLF on Windows. Compare parsed values, not lines
          # anchored to LF-only endings.
          $cargoVersion = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $cargoLockVersion = [regex]::Match($cargoLock, '(?s)\[\[package\]\]\s+name\s*=\s*"snapvere"\s+version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($cargoVersion -ne $config.version) { throw "Rust package version mismatch: $cargoVersion" }
          if ($cargoLockVersion -ne $config.version) { throw "Cargo.lock version mismatch: $cargoLockVersion" }
          if ($npmLock['version'] -ne $config.version -or $npmLock['packages']['']['version'] -ne $config.version) { throw 'npm lockfile version differs from release version' }
          "value=$($config.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Prevent overwriting an existing release tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseTag = 'v${{ steps.version.outputs.value }}'
          $matching = git ls-remote --tags origin "refs/tags/$releaseTag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify release tag availability' }
          if (-not [string]::IsNullOrWhiteSpace(($matching | Out-String).Trim())) {
            throw "Refusing to overwrite existing release: $releaseTag. Bump all app versions."
          }
      - name: Install dependencies using lockfile
        working-directory: apps/desktop
        run: npm ci --no-audit
      - name: Strict TypeScript static analysis
        working-directory: apps/desktop
        run: npm run lint
      - name: Build and typecheck frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Audit locked JavaScript dependencies
        working-directory: apps/desktop
        run: npm audit --audit-level=high
      - name: Verify Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Enforce Rust Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test Rust core on Windows
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Build Windows NSIS EXE and WiX MSI bundles
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles nsis,msi
      - name: Collect and verify ALL THREE release packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $PWD "dist-installers"
          New-Item -Path $dist -ItemType Directory -Force | Out-Null
          $target = Join-Path $PWD "apps/desktop/src-tauri/target/release"
          $portable = Join-Path $target "snapvere.exe"
          if (-not (Test-Path $portable)) { throw "Portable app executable is missing: $portable" }
          $nsis = Get-ChildItem -Path (Join-Path $target 'bundle/nsis') -Filter '*.exe' -File | Select-Object -First 1
          if (-not $nsis) { throw "NSIS setup.exe is missing" }
          $msi = Get-ChildItem -Path (Join-Path $target 'bundle/msi') -Filter '*.msi' -File | Select-Object -First 1
          if (-not $msi) { throw "WiX setup.msi is missing" }
          Copy-Item $portable (Join-Path $dist "Snapvere-Portable.exe")
          Copy-Item $nsis.FullName (Join-Path $dist "Snapvere-Setup.exe")
          Copy-Item $msi.FullName (Join-Path $dist "Snapvere-Setup.msi")
          $expected = @('Snapvere-Portable.exe','Snapvere-Setup.exe','Snapvere-Setup.msi')
          foreach ($name in $expected) {
            $f = Join-Path $dist $name
            if (-not (Test-Path $f)) { throw "Required Windows artifact missing: $name" }
            if ((Get-Item $f).Length -lt 1000000) { throw "Unexpectedly small artifact: $name" }
          }
          $hashes = foreach ($name in $expected) {
            $file = Join-Path $dist $name
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $hashes | Set-Content (Join-Path $dist "SHA256SUMS.txt") -Encoding ascii
          Get-ChildItem $dist | Format-Table Name,Length
      - name: Upload verified installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snapvere-v${{ steps.version.outputs.value }}-Windows
          path: dist-installers/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Snapvere v${{ steps.version.outputs.value }} — Brendigo
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: dist-installers/*
          body: |
            # Snapvere v${{ steps.version.outputs.value }} — Windows
            Branded by **Brendigo** · https://brendigo.com · https://snapvere.com

            ### Download
            - **Snapvere-Portable.exe** — run directly; no installer or administrator access required (Windows WebView2 runtime is required)
            - **Snapvere-Setup.exe** — NSIS installer
            - **Snapvere-Setup.msi** — MSI installer
            - **SHA256SUMS.txt** — integrity checksums for all packages

            All three Windows executables originate from the same Tauri build and were verified before publication.

            ### Changes in v${{ steps.version.outputs.value }}
            - More accurate screenshot cropping for negative virtual-desktop coordinates.
            - Literal gallery searches and consistent SQLite foreign key enforcement.
            - Development-only WebView2 debugging flags and read-only CI.
            - Non-mutating Rust format and strict Rust/TypeScript release gates.

            **Preview release.** Native Windows 10/11 capture, recorder, audio, multi-monitor,
            accessibility, install/upgrade/uninstall and 1:1 visual comparisons are not yet
            confirmed on representative physical Windows devices. CI does not substitute for QA.

            The public snapvere.com service currently distributes a separate .NET/WinUI edition.
            These packages are the Tauri/Rust repository edition, not interchangeable updates.
            This release is unsigned; use SHA256SUMS.txt to check each file.
