name: Browser Extensions CI

on:
  push:
    branches: [main]
    paths:
      - 'ekstenzije/**'
      - '.github/workflows/extensions-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ekstenzije/**'
      - '.github/workflows/extensions-ci.yml'

concurrency:
  group: snapvere-extensions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate extension contract
        run: node ekstenzije/tools/validate-extensions.mjs

      - name: Verify browser variant parity
        run: node ekstenzije/tools/verify-extension-parity.mjs

      - name: Check source syntax
        shell: bash
        run: |
          set -euo pipefail
          find ekstenzije/chrome ekstenzije/edge ekstenzije/opera ekstenzije/firefox \
            -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check ekstenzije/tools/validate-extensions.mjs
          node --check ekstenzije/tools/verify-extension-parity.mjs
          node --check ekstenzije/tools/validate-store-readiness.mjs
          python -m py_compile ekstenzije/tools/generate-store-assets.py

      - name: Generate browser store assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==11.3.0'
          python ekstenzije/tools/generate-store-assets.py

      - name: Validate browser store submission kit
        run: node ekstenzije/tools/validate-store-readiness.mjs

      - name: Build reproducible browser ZIP packages
        shell: bash
        run: |
          set -euo pipefail
          bash ekstenzije/tools/package-extensions.sh artifacts/extensions-pass-1
          bash ekstenzije/tools/package-extensions.sh artifacts/extensions-pass-2

          for name in Chrome Edge Opera Firefox; do
            cmp \
              "artifacts/extensions-pass-1/SNAPVERE-$name.zip" \
              "artifacts/extensions-pass-2/SNAPVERE-$name.zip"
          done
          diff -u \
            artifacts/extensions-pass-1/SHA256SUMS.txt \
            artifacts/extensions-pass-2/SHA256SUMS.txt

          rm -rf artifacts/extensions
          mv artifacts/extensions-pass-1 artifacts/extensions
          rm -rf artifacts/extensions-pass-2

      - name: Verify ZIP package contents and digests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/extensions/SNAPVERE-*.zip)
          [[ "${#packages[@]}" -eq 4 ]]

          (
            cd artifacts/extensions
            sha256sum -c SHA256SUMS.txt
          )

          for package in "${packages[@]}"; do
            listing="$(unzip -Z1 "$package")"
            grep -qx 'manifest.json' <<<"$listing"
            grep -qx 'background.js' <<<"$listing"
            grep -qx 'capture.js' <<<"$listing"
            grep -qx 'popup.html' <<<"$listing"
            grep -qx 'popup.css' <<<"$listing"
            grep -qx 'popup.js' <<<"$listing"
            grep -qx 'options.html' <<<"$listing"
            grep -qx 'options.css' <<<"$listing"
            grep -qx 'options.js' <<<"$listing"
            grep -qx '_locales/en/messages.json' <<<"$listing"
            grep -qx '_locales/hr/messages.json' <<<"$listing"
            grep -qx 'icons/icon-16.png' <<<"$listing"
            grep -qx 'icons/icon-32.png' <<<"$listing"
            grep -qx 'icons/icon-48.png' <<<"$listing"
            grep -qx 'icons/icon-128.png' <<<"$listing"

            if grep -E '(^|/)(node_modules|__pycache__|\.cache)(/|$)|\.DS_Store$|\.map$' <<<"$listing"; then
              echo "Development/cache artifact found in $package" >&2
              exit 1
            fi
          done

      - name: Upload browser packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapvere-browser-extensions-${{ github.sha }}
          path: |
            artifacts/extensions/SNAPVERE-*.zip
            artifacts/extensions/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload browser store submission kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapvere-browser-store-kit-${{ github.sha }}
          path: |
            ekstenzije/PRIVACY.md
            ekstenzije/store/README.md
            ekstenzije/store/listing.json
            ekstenzije/store/reviewer-notes.md
            ekstenzije/store/assets/*.png
          if-no-files-found: error
          retention-days: 30
