name: One-time visual probe readiness patch

on:
  push:
    branches:
      - ci/visual-probe-readiness-patch

permissions:
  contents: write

jobs:
  patch-target-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ci/visual-probe-readiness-patch
          path: helper
          persist-credentials: false

      - name: Checkout visual QA target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/stabilize-rendered-ui-probe
          path: target
          persist-credentials: true

      - name: Apply readiness handshake patch
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git apply --check ../helper/eng/visual-probe-readiness.patch
          git apply ../helper/eng/visual-probe-readiness.patch
          git diff --check

      - name: Commit readiness handshake to visual QA branch
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git add src/Snapvere.App/App.xaml.cs eng/Capture-SnapvereVisualQa.ps1
          git diff --cached --check
          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git commit -m 'Wait for rendered probe surfaces before visual QA'
          git push origin HEAD:fix/stabilize-rendered-ui-probe
