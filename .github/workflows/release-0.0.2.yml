name: Release 0.0.2

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snapvere-release-0.0.2
  cancel-in-progress: false

env:
  SNAPVERE_VERSION: 0.0.2

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release 0.0.2]')
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore and test release source
        shell: pwsh
        run: |
          dotnet restore SNAPVERE.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet build SNAPVERE.sln --configuration Release --no-restore -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet test tests/Snapvere.UnitTests/Snapvere.UnitTests.csproj --configuration Release --no-restore -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet restore src/Snapvere.App/Snapvere.App.csproj --runtime win-x86
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet build src/Snapvere.App/Snapvere.App.csproj --configuration Release --runtime win-x86 --no-restore -p:Platform=x86
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build x64 and x86 release packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          foreach ($arch in @("x64", "x86")) {
            $rid = "win-$arch"
            $appDir = "artifacts/app-$arch"
            $payload = Join-Path $PWD "artifacts/SNAPVERE-payload-$arch.zip"
            $setupDir = "artifacts/setup-$arch"
            $portableDir = "artifacts/portable-$arch"

            dotnet publish src/Snapvere.App/Snapvere.App.csproj `
              --configuration Release `
              --runtime $rid `
              -p:Platform=$arch `
              -p:SelfContained=true `
              -p:WindowsAppSDKSelfContained=true `
              -p:PublishReadyToRun=true `
              -p:DebugType=None `
              -p:DebugSymbols=false `
              -p:Version=$env:SNAPVERE_VERSION `
              --output $appDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Compress-Archive -Path "$appDir/*" -DestinationPath $payload -CompressionLevel Optimal

            dotnet publish src/Snapvere.Setup/Snapvere.Setup.csproj `
              --configuration Release `
              --runtime $rid `
              -p:Platform=$arch `
              -p:SnapverePayloadPath="$payload" `
              -p:Version=$env:SNAPVERE_VERSION `
              --output $setupDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            dotnet publish src/Snapvere.Portable/Snapvere.Portable.csproj `
              --configuration Release `
              --runtime $rid `
              -p:Platform=$arch `
              -p:SnapverePayloadPath="$payload" `
              -p:Version=$env:SNAPVERE_VERSION `
              --output $portableDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Copy-Item "$setupDir/SNAPVERE-Setup.exe" "release/SNAPVERE-$env:SNAPVERE_VERSION-Setup-$arch.exe"
            Copy-Item "$portableDir/SNAPVERE-Portable.exe" "release/SNAPVERE-$env:SNAPVERE_VERSION-Portable-$arch.exe"
            Copy-Item $payload "release/SNAPVERE-$env:SNAPVERE_VERSION-$arch.zip"
          }

      - name: Validate Setup, WinUI startup, normal launch, uninstall and Portable
        shell: pwsh
        run: |
          function Write-StartupLogIfPresent {
            $log = Join-Path $env:LOCALAPPDATA "SNAPVERE/Logs/startup.log"
            if (Test-Path $log) {
              Write-Host "----- SNAPVERE startup.log -----"
              Get-Content $log | Write-Host
              Write-Host "--------------------------------"
            }
          }

          function Invoke-StartupProbe([string]$FilePath, [string]$Name) {
            $marker = Join-Path $env:TEMP "SNAPVERE/startup-probe.ready"
            Remove-Item $marker -Force -ErrorAction SilentlyContinue
            $env:SNAPVERE_STARTUP_PROBE = "1"
            $process = $null

            try {
              $process = Start-Process -FilePath $FilePath -ArgumentList @("--startup-probe") -PassThru
              if (-not $process.WaitForExit(20000)) {
                Write-StartupLogIfPresent
                try { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue } catch {}
                throw "$Name startup probe timed out after 20 seconds."
              }

              if ($process.ExitCode -ne 0) {
                Write-StartupLogIfPresent
                throw "$Name startup probe failed with exit code $($process.ExitCode)."
              }

              if (-not (Test-Path $marker)) {
                Write-StartupLogIfPresent
                throw "$Name exited without reporting an activated WinUI main window."
              }

              $markerText = Get-Content $marker -Raw
              if ($markerText -notmatch "SNAPVERE 0\.0\.2 READY") {
                throw "$Name startup marker is invalid: $markerText"
              }

              Write-Host "$Name startup marker: $markerText"
            }
            finally {
              Remove-Item Env:SNAPVERE_STARTUP_PROBE -ErrorAction SilentlyContinue
              Remove-Item $marker -Force -ErrorAction SilentlyContinue
              if ($null -ne $process) { $process.Dispose() }
            }
          }

          function Invoke-NormalAppLaunch([string]$FilePath, [string]$Name) {
            Remove-Item Env:SNAPVERE_STARTUP_PROBE -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $FilePath -PassThru
            try {
              if ($process.WaitForExit(5000)) {
                Write-StartupLogIfPresent
                throw "$Name exited during normal startup with code $($process.ExitCode)."
              }
              Write-Host "$Name remained alive through the normal startup window (PID $($process.Id))."
            }
            finally {
              try {
                if (-not $process.HasExited) {
                  Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                  $null = $process.WaitForExit(5000)
                }
              } catch {}
              $process.Dispose()
            }
          }

          function Invoke-NormalPortableLaunch([string]$FilePath, [string]$Arch) {
            Remove-Item Env:SNAPVERE_STARTUP_PROBE -ErrorAction SilentlyContinue
            $launcher = Start-Process -FilePath $FilePath -PassThru
            try {
              if (-not $launcher.WaitForExit(15000)) {
                try { Stop-Process -Id $launcher.Id -Force -ErrorAction SilentlyContinue } catch {}
                throw "$Arch Portable launcher did not return after its startup validation window."
              }

              if ($launcher.ExitCode -ne 0) {
                Write-StartupLogIfPresent
                throw "$Arch Portable launcher failed normal startup with code $($launcher.ExitCode)."
              }

              Start-Sleep -Milliseconds 500
              $appProcesses = @(Get-Process -Name Snapvere -ErrorAction SilentlyContinue)
              if ($appProcesses.Count -eq 0) {
                Write-StartupLogIfPresent
                throw "$Arch Portable launcher returned success but no SNAPVERE app process remained alive."
              }

              Write-Host "$Arch Portable normal startup left $($appProcesses.Count) SNAPVERE process(es) alive."
              foreach ($app in $appProcesses) {
                try { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue } catch {}
              }
            }
            finally {
              $launcher.Dispose()
            }
          }

          $required = @(
            "release/SNAPVERE-$env:SNAPVERE_VERSION-Setup-x64.exe",
            "release/SNAPVERE-$env:SNAPVERE_VERSION-Portable-x64.exe",
            "release/SNAPVERE-$env:SNAPVERE_VERSION-Setup-x86.exe",
            "release/SNAPVERE-$env:SNAPVERE_VERSION-Portable-x86.exe",
            "release/SNAPVERE-$env:SNAPVERE_VERSION-x64.zip",
            "release/SNAPVERE-$env:SNAPVERE_VERSION-x86.zip"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
            if ((Get-Item $file).Length -lt 1MB) { throw "Release file is unexpectedly small: $file" }
          }

          foreach ($arch in @("x64", "x86")) {
            $setup = (Resolve-Path "release/SNAPVERE-$env:SNAPVERE_VERSION-Setup-$arch.exe").Path
            $portable = (Resolve-Path "release/SNAPVERE-$env:SNAPVERE_VERSION-Portable-$arch.exe").Path
            $install = Join-Path $env:LOCALAPPDATA "Programs/SNAPVERE"

            Remove-Item (Join-Path $env:LOCALAPPDATA "SNAPVERE/Logs/startup.log") -Force -ErrorAction SilentlyContinue

            $licenseProbe = Start-Process -FilePath $setup -ArgumentList @("--silent") -Wait -PassThru
            if ($licenseProbe.ExitCode -ne 2) {
              throw "$arch Setup accepted silent install without explicit license acceptance."
            }

            $installProcess = Start-Process -FilePath $setup -ArgumentList @("--silent", "--accept-license") -Wait -PassThru
            if ($installProcess.ExitCode -ne 0) {
              throw "$arch Setup failed to install with code $($installProcess.ExitCode)."
            }

            $installedApp = Join-Path $install "Snapvere.exe"
            if (-not (Test-Path $installedApp)) { throw "$arch install is missing Snapvere.exe." }
            if (-not (Test-Path (Join-Path $install "SNAPVERE-Setup.exe"))) { throw "$arch install is missing maintenance Setup." }
            if (Get-ChildItem $install -Filter "uninstall*.exe" -ErrorAction SilentlyContinue) {
              throw "$arch install contains a separate uninstall executable."
            }

            Invoke-StartupProbe $installedApp "Installed SNAPVERE $arch"
            Invoke-NormalAppLaunch $installedApp "Installed SNAPVERE $arch"

            $installedSetup = Join-Path $install "SNAPVERE-Setup.exe"
            $uninstallProcess = Start-Process -FilePath $installedSetup -ArgumentList @("--uninstall", "--silent") -Wait -PassThru
            if ($uninstallProcess.ExitCode -ne 0) {
              throw "$arch Setup failed to uninstall with code $($uninstallProcess.ExitCode)."
            }

            $deadline = (Get-Date).AddSeconds(15)
            while ((Test-Path $installedApp) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 250
            }
            if (Test-Path $installedApp) { throw "$arch uninstall cleanup timed out." }

            Invoke-StartupProbe $portable "Portable SNAPVERE $arch"
            Invoke-NormalPortableLaunch $portable $arch
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii release/SHA256SUMS.txt

      - name: Create immutable v0.0.2 tag
        shell: pwsh
        run: |
          if (git ls-remote --exit-code --tags origin "refs/tags/v$env:SNAPVERE_VERSION") {
            throw "Tag v$env:SNAPVERE_VERSION already exists. Refusing to replace an immutable release tag."
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$env:SNAPVERE_VERSION" -m "SNAPVERE v$env:SNAPVERE_VERSION"
          git push origin "v$env:SNAPVERE_VERSION"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release -File | ForEach-Object { $_.FullName }
          & gh release create "v$env:SNAPVERE_VERSION" @assets `
            --title "SNAPVERE v$env:SNAPVERE_VERSION" `
            --notes-file RELEASE_NOTES_0.0.2.md `
            --latest `
            --verify-tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
