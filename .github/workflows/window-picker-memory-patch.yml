name: Apply Window Picker memory patch

on:
  push:
    branches:
      - performance/window-picker-memory
    paths:
      - .github/workflows/window-picker-memory-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Window Capture allocation reductions
        shell: python
        run: |
          from pathlib import Path

          overlay_path = Path("src/Snapvere.App/WindowTargetOverlayWindow.cs")
          overlay = overlay_path.read_text(encoding="utf-8")
          overlay_replacements = [
              (
                  "    private readonly CaptureFrame _frozenFrame;",
                  "    private CaptureFrame? _frozenFrame;"
              ),
              (
                  '''    private async void Root_Loaded(object sender, RoutedEventArgs e)\n    {\n        try\n        {\n            _frozenImage.Source = await CreateFrozenBitmapAsync(_frozenFrame);\n            UpdateTargetVisual();\n            _ = _focusTarget.Focus(FocusState.Programmatic);\n        }\n        catch\n        {\n            _cancelled();\n        }\n    }''',
                  '''    private async void Root_Loaded(object sender, RoutedEventArgs e)\n    {\n        try\n        {\n            var frozenFrame = _frozenFrame\n                ?? throw new InvalidOperationException("The Window Capture frozen frame is no longer available.");\n            _frozenImage.Source = await CreateFrozenBitmapAsync(frozenFrame);\n            _frozenFrame = null;\n            UpdateTargetVisual();\n            _ = _focusTarget.Focus(FocusState.Programmatic);\n        }\n        catch\n        {\n            _frozenFrame = null;\n            _cancelled();\n        }\n    }'''
              ),
              (
                  '''        frame.Validate();\n        var rowLength = checked(frame.Size.Width * 4);\n        var packedPixels = new byte[checked(rowLength * frame.Size.Height)];\n        var source = frame.Bgra8Pixels.Span;\n\n        for (var y = 0; y < frame.Size.Height; y++)\n        {\n            source.Slice(checked(y * frame.Stride), rowLength)\n                .CopyTo(packedPixels.AsSpan(checked(y * rowLength), rowLength));\n        }\n\n        var bitmap = new WriteableBitmap(frame.Size.Width, frame.Size.Height);\n        using var pixelStream = bitmap.PixelBuffer.AsStream();\n        pixelStream.Position = 0;\n        await pixelStream.WriteAsync(packedPixels);\n        bitmap.Invalidate();\n        return bitmap;''',
                  '''        frame.Validate();\n        var rowLength = checked(frame.Size.Width * 4);\n        var bitmap = new WriteableBitmap(frame.Size.Width, frame.Size.Height);\n        using var pixelStream = bitmap.PixelBuffer.AsStream();\n        pixelStream.Position = 0;\n\n        if (frame.Stride == rowLength)\n        {\n            await pixelStream.WriteAsync(\n                frame.Bgra8Pixels.Slice(0, checked(rowLength * frame.Size.Height)));\n        }\n        else\n        {\n            for (var y = 0; y < frame.Size.Height; y++)\n            {\n                await pixelStream.WriteAsync(\n                    frame.Bgra8Pixels.Slice(checked(y * frame.Stride), rowLength));\n            }\n        }\n\n        bitmap.Invalidate();\n        return bitmap;'''
              ),
          ]

          for old, new in overlay_replacements:
              count = overlay.count(old)
              if count != 1:
                  raise SystemExit(f"Overlay replacement expected one match, found {count}")
              overlay = overlay.replace(old, new, 1)
          overlay_path.write_text(overlay, encoding="utf-8", newline="\n")

          picker_path = Path("src/Snapvere.App/WindowTargetPicker.cs")
          picker = picker_path.read_text(encoding="utf-8")
          old = '''                overlays.Add(overlay);\n            }\n\n            foreach (var overlay in overlays)'''
          new = '''                overlays.Add(overlay);\n            }\n\n            // Overlay instances now own the frozen frames until their bitmap is loaded.\n            // Drop the coordinator dictionary references before showing the surfaces so\n            // each raw BGRA frame can be collected as soon as its overlay finishes loading.\n            frozenFrames.Clear();\n\n            foreach (var overlay in overlays)'''
          count = picker.count(old)
          if count != 1:
              raise SystemExit(f"Picker replacement expected one match, found {count}")
          picker = picker.replace(old, new, 1)
          picker_path.write_text(picker, encoding="utf-8", newline="\n")

      - name: Commit production diff and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/window-picker-memory-patch.yml
          git add src/Snapvere.App/WindowTargetOverlayWindow.cs src/Snapvere.App/WindowTargetPicker.cs
          git commit -m "Reduce Window Capture picker memory"
          git push
