name: Windows ARM64 Runtime CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: snapvere-arm64-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-arm64-runtime:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install pinned WiX validation CLI
        shell: pwsh
        run: |
          dotnet tool install --tool-path artifacts/wix-cli wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/wix-cli/wix.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Confirm native ARM64 runner
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "PROCESSOR_ARCHITEW6432=$env:PROCESSOR_ARCHITEW6432"
          if (-not [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().Equals('Arm64', [StringComparison]::OrdinalIgnoreCase)) {
            throw "ARM64 runtime QA requires a native ARM64 OS. Actual: $([Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          }
          if (-not [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().Equals('Arm64', [StringComparison]::OrdinalIgnoreCase)) {
            throw "ARM64 runtime QA requires a native ARM64 PowerShell process. Actual: $([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
          }

      - name: Resolve product versions
        shell: pwsh
        run: |
          $contract = Get-Content -LiteralPath product-version.json -Raw | ConvertFrom-Json
          $version = [string]$contract.currentRelease
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'currentRelease must use x.y.z.' }
          $parts = $version.Split('.') | ForEach-Object { [int]$_ }
          if ($parts[2] -le 0) { throw 'ARM64 MSI upgrade baseline requires a patch version greater than zero.' }
          $previous = "$($parts[0]).$($parts[1]).$($parts[2] - 1)"
          "SNAPVERE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SNAPVERE_PREVIOUS_MSI_VERSION=$previous" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build universal application payloads on ARM64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $platforms = @{ x86='x86'; x64='x64'; arm64='ARM64' }
          foreach ($arch in @('x86','x64','arm64')) {
            $rid = "win-$arch"
            $output = "artifacts/app-$arch"
            dotnet publish src/Snapvere.App/Snapvere.App.csproj `
              --configuration Release `
              --runtime $rid `
              "-p:Platform=$($platforms[$arch])" `
              -p:SelfContained=true `
              -p:WindowsAppSDKSelfContained=true `
              -p:PublishReadyToRun=true `
              -p:DebugType=None `
              -p:DebugSymbols=false `
              "-p:Version=$env:SNAPVERE_VERSION" `
              --output $output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $root = (Resolve-Path $output).Path
            $files = @(Get-ChildItem -LiteralPath $root -Recurse -File | ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\','/')
              [pscustomobject]@{
                Path = $relative
                Length = $_.Length
                Sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
              }
            } | Sort-Object Path)
            if ($files.Count -eq 0) { throw "$arch payload is empty." }
            [pscustomobject]@{ FormatVersion=1; Files=$files } |
              ConvertTo-Json -Depth 4 -Compress |
              Set-Content -LiteralPath "artifacts/SNAPVERE-payload-$arch.integrity.json" -Encoding utf8NoBOM
            Compress-Archive -Path "$output/*" -DestinationPath "artifacts/SNAPVERE-payload-$arch.zip" -CompressionLevel Optimal
          }

      - name: Prove native ARM64 application payload can launch
        shell: pwsh
        run: |
          $app = (Resolve-Path 'artifacts/app-arm64/Snapvere.exe').Path
          $marker = Join-Path $env:TEMP 'SNAPVERE/startup-probe.ready'
          Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
          $env:SNAPVERE_STARTUP_PROBE = '1'
          try {
            $process = Start-Process -FilePath $app -ArgumentList @('--startup-probe') -PassThru
            try {
              if (-not $process.WaitForExit(30000)) {
                try { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue } catch {}
                throw 'Native ARM64 Snapvere.exe startup probe timed out.'
              }
              if ($process.ExitCode -ne 0) { throw "Native ARM64 Snapvere.exe exited with code $($process.ExitCode)." }
            }
            finally {
              $process.Dispose()
            }
          }
          finally {
            Remove-Item Env:SNAPVERE_STARTUP_PROBE -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) { throw 'Native ARM64 app did not publish its startup marker.' }
          $text = Get-Content -LiteralPath $marker -Raw
          if ($text -notmatch "SNAPVERE $([Regex]::Escape($env:SNAPVERE_VERSION)) READY") { throw "Invalid native ARM64 startup marker: $text" }
          Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue

      - name: Build Universal Setup and Portable on ARM64 runner
        shell: pwsh
        run: |
          $x86 = (Resolve-Path 'artifacts/SNAPVERE-payload-x86.zip').Path
          $x64 = (Resolve-Path 'artifacts/SNAPVERE-payload-x64.zip').Path
          $arm64 = (Resolve-Path 'artifacts/SNAPVERE-payload-arm64.zip').Path
          $x86Integrity = (Resolve-Path 'artifacts/SNAPVERE-payload-x86.integrity.json').Path
          $x64Integrity = (Resolve-Path 'artifacts/SNAPVERE-payload-x64.integrity.json').Path
          $arm64Integrity = (Resolve-Path 'artifacts/SNAPVERE-payload-arm64.integrity.json').Path

          dotnet publish src/Snapvere.Setup/Snapvere.Setup.csproj `
            --configuration Release `
            --runtime win-x86 `
            -p:Platform=x86 `
            -p:SelfContained=true `
            "-p:Version=$env:SNAPVERE_VERSION" `
            "-p:SnapverePayloadX86Path=$x86" `
            "-p:SnapverePayloadX64Path=$x64" `
            "-p:SnapverePayloadArm64Path=$arm64" `
            --output artifacts/setup-universal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet publish src/Snapvere.Portable/Snapvere.Portable.csproj `
            --configuration Release `
            --runtime win-x86 `
            -p:Platform=x86 `
            -p:SelfContained=true `
            "-p:Version=$env:SNAPVERE_VERSION" `
            "-p:SnapverePayloadX86Path=$x86" `
            "-p:SnapverePayloadX64Path=$x64" `
            "-p:SnapverePayloadArm64Path=$arm64" `
            "-p:SnapverePayloadX86IntegrityPath=$x86Integrity" `
            "-p:SnapverePayloadX64IntegrityPath=$x64Integrity" `
            "-p:SnapverePayloadArm64IntegrityPath=$arm64Integrity" `
            --output artifacts/portable-universal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run real ARM64 Setup and Portable lifecycle
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'artifacts/setup-universal/SNAPVERE-Setup.exe').Path
          $portable = (Resolve-Path 'artifacts/portable-universal/SNAPVERE-Portable.exe').Path
          $env:SNAPVERE_PAYLOAD_ARCH = 'arm64'
          try {
            & ./eng/Test-SnapverePackageLifecycle.ps1 -SetupPath $setup -PortablePath $portable -Version $env:SNAPVERE_VERSION -Arch arm64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            & ./eng/Test-SnapvereTrayFirstLaunch.ps1 -SetupPath $setup -PortablePath $portable -Version $env:SNAPVERE_VERSION -Arch arm64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Remove-Item Env:SNAPVERE_PAYLOAD_ARCH -ErrorAction SilentlyContinue
          }

      - name: Build ARM64 MSI current and upgrade baseline
        shell: pwsh
        run: |
          $payload = (Resolve-Path 'artifacts/app-arm64').Path
          foreach ($build in @(
            @{ Version=$env:SNAPVERE_VERSION; Output='artifacts/msi-arm64-current' },
            @{ Version=$env:SNAPVERE_PREVIOUS_MSI_VERSION; Output='artifacts/msi-arm64-previous' }
          )) {
            $output = Join-Path $PWD $build.Output
            New-Item -ItemType Directory -Force -Path $output | Out-Null
            dotnet build src/Snapvere.Msi/Snapvere.Msi.wixproj `
              --configuration Release `
              -t:Rebuild `
              "-p:SnapvereVersion=$($build.Version)" `
              -p:MsiArchitecture=arm64 `
              "-p:SnapverePayloadDir=$payload" `
              "-p:OutputPath=$output\"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $msi = Join-Path $output 'SNAPVERE-Setup.msi'
            if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) { throw "ARM64 MSI build did not produce $msi." }
            & ./eng/Normalize-SnapvereMsiLanguageMetadata.ps1 -MsiPath $msi -WixExePath './artifacts/wix-cli/wix.exe' -ReportPath (Join-Path $output 'language-normalization.json')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ./artifacts/wix-cli/wix.exe msi validate $msi
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          & ./eng/Assert-SnapvereMsi.ps1 -MsiPath artifacts/msi-arm64-current/SNAPVERE-Setup.msi -Version $env:SNAPVERE_VERSION -Architecture arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./eng/Assert-SnapvereMsi.ps1 -MsiPath artifacts/msi-arm64-previous/SNAPVERE-Setup.msi -Version $env:SNAPVERE_PREVIOUS_MSI_VERSION -Architecture arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & ./eng/Assert-SnapvereMsiUpgradePair.ps1 `
            -CurrentMsiPath artifacts/msi-arm64-current/SNAPVERE-Setup.msi `
            -CurrentVersion $env:SNAPVERE_VERSION `
            -PreviousMsiPath artifacts/msi-arm64-previous/SNAPVERE-Setup.msi `
            -PreviousVersion $env:SNAPVERE_PREVIOUS_MSI_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run native ARM64 MSI lifecycle
        shell: pwsh
        run: |
          & ./eng/Test-SnapvereMsiLifecycle.ps1 `
            -MsiPath artifacts/msi-arm64-current/SNAPVERE-Setup.msi `
            -Version $env:SNAPVERE_VERSION `
            -PreviousMsiPath artifacts/msi-arm64-previous/SNAPVERE-Setup.msi `
            -PreviousVersion $env:SNAPVERE_PREVIOUS_MSI_VERSION `
            -LogDirectory (Join-Path $PWD 'artifacts/msi-arm64-logs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload ARM64 runtime QA evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapvere-arm64-runtime-qa-${{ github.sha }}
          path: |
            artifacts/msi-arm64-current/SNAPVERE-Setup.msi
            artifacts/msi-arm64-previous/SNAPVERE-Setup.msi
            artifacts/msi-arm64-current/language-normalization.json
            artifacts/msi-arm64-previous/language-normalization.json
            artifacts/msi-arm64-logs/*.log
          if-no-files-found: warn
          retention-days: 30
