name: Capture real Snapvere frontend previews
on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/capture_ui.py'
      - '.github/workflows/screenshots.yml'
      - 'apps/desktop/src/**'
      - 'site/**/*.html'
      - 'site/styles.css'
      - 'site/favicon.svg'
      - 'site/config.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install app dependencies and Playwright
        shell: bash
        run: |
          cd apps/desktop
          npm ci --no-audit
          cd ../..
          python -m pip install "playwright>=1.55,<2" "Pillow>=10,<13"
          python -m playwright install --with-deps chromium
      - name: Serve real frontend and website
        shell: bash
        run: |
          (cd apps/desktop && npm run dev -- --host 127.0.0.1 > /tmp/snapvere-vite.log 2>&1 &)
          (cd site && python -m http.server 4173 --bind 127.0.0.1 > /tmp/snapvere-site.log 2>&1 &)
          python - <<'PY'
          import time, urllib.request
          for url in ['http://127.0.0.1:1420/', 'http://127.0.0.1:4173/']:
              for attempt in range(40):
                  try:
                      urllib.request.urlopen(url, timeout=2).read(200)
                      break
                  except Exception:
                      time.sleep(0.5)
              else:raise SystemExit('Server did not start: '+url)
          PY
      - name: Screenshot rendered screens
        run: python tools/capture_ui.py
      - name: Measure exact visual differences from the deployed Snapvere website
        continue-on-error: true
        run: python tools/compare_live_site.py
      - name: Upload live-site visual comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Snapvere-Live-Site-Comparison
          path: docs/visual-audit/
          if-no-files-found: warn
      - name: Upload screenshot previews
        uses: actions/upload-artifact@v4
        with:
          name: Snapvere-UI-Screenshots
          path: |
            docs/screenshots/*.png
            site/screenshots/*.png
