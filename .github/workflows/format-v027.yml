name: Format native Snapvere v0.2.7 changes
on:
  push:
    branches: [feature/snapvere-v0.2.7-ui-reliability]
    paths: ['.github/workflows/format-v027.yml']
permissions:
  contents: write
jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and verify rustfmt
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Commit native code formatting to PR only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/
          if ! git diff --cached --quiet; then
            git commit -m "style(rust): format Snapvere v0.2.7 native sources"
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
