name: MSI Build CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: snapvere-msi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msi-build-lifecycle:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install pinned WiX validation CLI
        shell: pwsh
        run: |
          dotnet tool install --tool-path artifacts/wix-cli wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/wix-cli/wix.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve MSI versions
        shell: pwsh
        run: |
          $contract = Get-Content -LiteralPath 'product-version.json' -Raw | ConvertFrom-Json
          $version = [string]$contract.currentRelease
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'currentRelease must use x.y.z.' }
          if ([string]$contract.windows.productVersion -ne $version) { throw 'Windows productVersion does not match currentRelease.' }
          if (-not (@($contract.releaseAssets) -contains 'SNAPVERE-Setup.msi')) { throw 'Release contract does not require SNAPVERE-Setup.msi.' }

          $parts = $version.Split('.') | ForEach-Object { [int]$_ }
          if ($parts[2] -le 0) { throw 'Synthetic MSI upgrade baseline requires a patch version greater than zero.' }
          $previous = "$($parts[0]).$($parts[1]).$($parts[2] - 1)"

          "SNAPVERE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SNAPVERE_PREVIOUS_MSI_VERSION=$previous" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "MSI lifecycle contract: $previous -> $version"

      - name: Publish x64 application payload
        shell: pwsh
        run: |
          dotnet publish src/Snapvere.App/Snapvere.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            -p:Platform=x64 `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishReadyToRun=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$env:SNAPVERE_VERSION `
            --output artifacts/app-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build current production MSI
        shell: pwsh
        run: |
          $payload = (Resolve-Path 'artifacts/app-x64').Path
          $output = Join-Path $PWD 'artifacts/msi-current'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          dotnet build src/Snapvere.Msi/Snapvere.Msi.wixproj `
            --configuration Release `
            -p:SnapvereVersion=$env:SNAPVERE_VERSION `
            "-p:SnapverePayloadDir=$payload" `
            "-p:OutputPath=$output\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi = Join-Path $output 'SNAPVERE-Setup.msi'
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) {
            throw 'Current MSI build did not produce SNAPVERE-Setup.msi.'
          }
          & ./eng/Normalize-SnapvereMsiLanguageMetadata.ps1 -MsiPath $msi -WixExePath './artifacts/wix-cli/wix.exe' -ReportPath (Join-Path $output 'language-normalization.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/wix-cli/wix.exe msi validate $msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build synthetic previous-version MSI for major-upgrade QA
        shell: pwsh
        run: |
          $payload = (Resolve-Path 'artifacts/app-x64').Path
          $output = Join-Path $PWD 'artifacts/msi-previous'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          dotnet build src/Snapvere.Msi/Snapvere.Msi.wixproj `
            --configuration Release `
            -p:SnapvereVersion=$env:SNAPVERE_PREVIOUS_MSI_VERSION `
            "-p:SnapverePayloadDir=$payload" `
            "-p:OutputPath=$output\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi = Join-Path $output 'SNAPVERE-Setup.msi'
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) {
            throw 'Previous-version MSI build did not produce SNAPVERE-Setup.msi.'
          }
          & ./eng/Normalize-SnapvereMsiLanguageMetadata.ps1 -MsiPath $msi -WixExePath './artifacts/wix-cli/wix.exe' -ReportPath (Join-Path $output 'language-normalization.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/wix-cli/wix.exe msi validate $msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate MSI database contract
        shell: pwsh
        run: |
          & ./eng/Assert-SnapvereMsi.ps1 `
            -MsiPath 'artifacts/msi-current/SNAPVERE-Setup.msi' `
            -Version $env:SNAPVERE_VERSION `
            -Architecture x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & ./eng/Assert-SnapvereMsi.ps1 `
            -MsiPath 'artifacts/msi-previous/SNAPVERE-Setup.msi' `
            -Version $env:SNAPVERE_PREVIOUS_MSI_VERSION `
            -Architecture x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test MSI clean install repair major upgrade and uninstall
        shell: pwsh
        run: |
          & ./eng/Test-SnapvereMsiLifecycle.ps1 `
            -MsiPath 'artifacts/msi-current/SNAPVERE-Setup.msi' `
            -Version $env:SNAPVERE_VERSION `
            -PreviousMsiPath 'artifacts/msi-previous/SNAPVERE-Setup.msi' `
            -PreviousVersion $env:SNAPVERE_PREVIOUS_MSI_VERSION `
            -LogDirectory (Join-Path $PWD 'artifacts/msi-logs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload MSI QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapvere-msi-qa-${{ github.sha }}
          path: |
            artifacts/msi-current/SNAPVERE-Setup.msi
            artifacts/msi-current/language-normalization.json
            artifacts/msi-previous/language-normalization.json
            artifacts/msi-logs/*.log
          if-no-files-found: warn
          retention-days: 30
