name: Refresh native and website Snapvere logo assets
on:
  push:
    branches: [feature/snapvere-v0.2.7-ui-reliability]
    paths:
      - site/favicon.svg
      - tools/build_brand_assets.py
      - .github/workflows/refresh-brand-assets.yml
permissions:
  contents: write
jobs:
  synchronize-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build-only raster tools
        run: python -m pip install "cairosvg>=2.7,<3" "Pillow>=11,<13"
      - name: Derive all shipped logos from site/favicon.svg
        run: python tools/build_brand_assets.py
      - name: Commit synchronized binary icons to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/icon.png site/og.png apps/desktop/src-tauri/icons/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets(brand): regenerate matching Windows/macOS/web icons and social preview'
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep 2
          done
          exit 1
