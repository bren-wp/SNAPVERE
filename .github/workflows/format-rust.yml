name: Apply consistent Rust formatting to Snapvere v0.2.6
on:
  push:
    branches: [fix/snapvere-v0.2.6-rustfmt]
permissions:
  contents: write
jobs:
  format-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt across all Tauri source modules
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all
      - name: Verify format is stable
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Commit formatting to development branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src-tauri/src/
          if ! git diff --cached --quiet; then
            git commit -m 'style(rust): apply rustfmt consistently across native capture and recording source'
            git push origin HEAD:fix/snapvere-v0.2.6-rustfmt
          fi
