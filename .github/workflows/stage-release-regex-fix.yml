name: Stage 0.1.3 Release Regex Fix

on:
  push:
    branches: [release/v0.1.3]
    paths:
      - '.github/release-triggers/stage-regex-fix-v0.1.3'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Correct escaped previous-version regexes into staging blob
        shell: python
        run: |
          from pathlib import Path
          source_path = Path('.github/workflows/release-0.1.3.yml')
          target_path = Path('.github/release-staging/release-0.1.3-fixed.yml')
          text = source_path.read_text(encoding='utf-8')
          old = r'0\.1\.2'
          new = r'0\.1\.3'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected exactly 3 escaped stale version regexes, found {count}')
          fixed = text.replace(old, new)
          if old in fixed:
              raise SystemExit('stale escaped 0.1.2 regex remains after replacement')
          required = [
              r'"version"[[:space:]]*:[[:space:]]*"0\.1\.3"',
              r'"extensionVersion"[[:space:]]*:[[:space:]]*"0\.1\.3"',
              r'"developmentChannel"[[:space:]]*:[[:space:]]*"v0\.1\.3-release"',
          ]
          for marker in required:
              if marker not in fixed:
                  raise SystemExit(f'missing corrected release regex marker: {marker}')
          target_path.parent.mkdir(parents=True, exist_ok=True)
          target_path.write_text(fixed, encoding='utf-8', newline='\n')

      - name: Validate staged workflow and source contract
        shell: bash
        run: |
          set -euo pipefail
          staged=.github/release-staging/release-0.1.3-fixed.yml
          grep -Fqx 'name: Release 0.1.3' "$staged"
          grep -Fq 'SNAPVERE_VERSION: 0.1.3' "$staged"
          ! grep -Fq '0\.1\.2' "$staged"
          grep -Fq '0\.1\.3' "$staged"
          python3 eng/validate-product-contract.py
          git diff --check

      - name: Commit staged corrected workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/release-staging/release-0.1.3-fixed.yml
          git commit -m 'Stage corrected SNAPVERE 0.1.3 release workflow'
          git push origin HEAD:release/v0.1.3
